name: "feroxbuster"
command: "feroxbuster"
enabled: false
short_description: "递归内容发现工具"
description: |
  Feroxbuster是一个快速、简单的递归内容发现工具。

  **Key Features:**
  - 递归目录发现
  - Multi-threading support
  - 自动过滤
  - Multiple output formats

  **Use Cases:**
  - Web内容发现
  - Directory enumeration
  - File discovery
  - Security testing
parameters:
  - name: "url"
    type: "string"
    description: "Target URL"
    required: true
    flag: "-u"
    format: "flag"
  - name: "wordlist"
    type: "string"
    description: "Dictionary file path"
    required: false
    flag: "-w"
    format: "flag"
  - name: "threads"
    type: "int"
    description: "Number of threads"
    required: false
    flag: "-t"
    format: "flag"
    default: 10
  - name: "additional_args"
    type: "string"
    description: |
      Additional feroxbuster parameters. Used to pass feroxbuster options not defined in the parameter list.

      **Example Values:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Multiple parameters are separated by spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
