name: "hashcat"
command: "hashcat"
enabled: true
short_description: "advanced password-cracking tool, supports GPU acceleration"
description: |
  Hashcat is an advanced password recovery tool that supports multiple hash algorithms and attack modes.

  **Key Features:**
  - Supports multiple hash algorithms
  - GPU acceleration
  - Multiple attack modes (dictionary, combination, mask, etc.)
  - Rule engine

  **Use Cases:**
  - Password recovery
  - Hash cracking
  - Security testing
  - Forensic analysis
parameters:
  - name: "hash_file"
    type: "string"
    description: "File containing the hash"
    required: true
    position: 0
    format: "positional"
  - name: "hash_type"
    type: "string"
    description: "hash type number"
    required: true
    flag: "-m"
    format: "flag"
  - name: "attack_mode"
    type: "string"
    description: "attack mode (0=dictionary, 1=combination, 3=mask, etc.)"
    required: false
    default: "0"
    flag: "-a"
    format: "flag"
  - name: "wordlist"
    type: "string"
    description: "Dictionary file"
    required: false
    default: "/usr/share/wordlists/rockyou.txt"
    position: 1
    format: "positional"
  - name: "mask"
    type: "string"
    description: "mask (for mask attacks)"
    required: false
    position: 2
    format: "positional"
  - name: "additional_args"
    type: "string"
    description: "extra Hashcat arguments"
    required: false
    format: "positional"
