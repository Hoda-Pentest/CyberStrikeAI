name: "x8"
command: "x8"
enabled: true
short_description: "隐藏参数发现工具"
description: |
  X8是一个用于发现Web应用中隐藏参数的工具。

  **Key Features:**
  - 隐藏参数发现
  - 多种HTTP方法支持
  - 自定义字典
  - Quick scan

  **Use Cases:**
  - Parameter discovery
  - Web application security testing
  - Bug bounty reconnaissance
  - Security testing
parameters:
  - name: "url"
    type: "string"
    description: "Target URL"
    required: true
    flag: "--url"
    format: "flag"
  - name: "wordlist"
    type: "string"
    description: "参数字典"
    required: false
    flag: "--wordlist"
    format: "flag"
    default: "/usr/share/wordlists/x8/params.txt"
  - name: "method"
    type: "string"
    description: "HTTP方法"
    required: false
    flag: "--method"
    format: "flag"
    default: "GET"
  - name: "body"
    type: "string"
    description: "请求体"
    required: false
    flag: "--body"
    format: "flag"
  - name: "headers"
    type: "string"
    description: "自定义请求头"
    required: false
    flag: "--headers"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Additional x8 parameters. Used to pass x8 options not defined in the parameter list.

      **Example Values:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Multiple parameters are separated by spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
