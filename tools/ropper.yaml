name: "ropper"
command: "ropper"
enabled: true
short_description: "高级ROP/JOP gadget搜索工具"
description: |
  Ropper是一个高级ROP/JOP gadget搜索工具，用于漏洞利用开发。

  **Key Features:**
  - ROP/JOP gadget搜索
  - Gadget质量评估
  - Multiple architecture support
  - Exploit chain generation

  **Use Cases:**
  - Exploit development
  - ROP chain construction
  - Binary analysis
  - Security research
parameters:
  - name: "binary"
    type: "string"
    description: "Path to the binary file to analyze"
    required: true
    flag: "--file"
    format: "flag"
  - name: "gadget_type"
    type: "string"
    description: "Gadget类型（rop, jop, sys, all）"
    required: false
    flag: "--type"
    format: "flag"
    default: "rop"
  - name: "quality"
    type: "int"
    description: "Gadget质量级别（1-5）"
    required: false
    flag: "--quality"
    format: "flag"
    default: 1
  - name: "arch"
    type: "string"
    description: "目标架构（x86, x86_64, arm等）"
    required: false
    flag: "--arch"
    format: "flag"
  - name: "search_string"
    type: "string"
    description: "要搜索的特定gadget模式"
    required: false
    flag: "--search"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Additional ropper parameters. Used to pass ropper options not defined in the parameter list.

      **Example Values:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Multiple parameters are separated by spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
