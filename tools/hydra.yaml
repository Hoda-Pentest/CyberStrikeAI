name: "hydra"
command: "hydra"
args: ["-I"]
enabled: true
short_description: "Password brute-force tool, supports multiple protocols and services"
description: |
  Hydra is a network login brute-force tool, supporting SSH, FTP, HTTP, SMB, and many other protocols.

  **Calling convention (must read):**
  - You must provide a **username**: `username` (-l) or `username_file` (-L), at least one of the two
  - You must provide a **credential**: `password` (-p), `password_file` (-P), or `-C` (via `additional_args`), at least one of the three
  - **Try a small dictionary first** (a few dozen to a few hundred entries), confirm the target is reachable before scaling up; never default to a huge wordlist such as rockyou
  - Enabled by default: stop on first find (-f), parallelism 4 (-t), ignore restore (-I); set `output_file` for long-running tasks

  **CLI order:** `hydra [options] <target> <service>` (this tool assembles arguments in this order; do not put target before the options)

  **Use Cases:** Weak-credential detection and password strength assessment in authorized environments

  **Note:** For authorized targets only; if a target is unresponsive, lower `wait_time` or shrink the dictionary to avoid long hangs.
parameters:
  - name: "username"
    type: "string"
    description: "A single username (-l); fill in either this or username_file"
    required: false
    flag: "-l"
    format: "flag"
  - name: "username_file"
    type: "string"
    description: "Username dictionary file (-L)"
    required: false
    flag: "-L"
    format: "flag"
  - name: "password"
    type: "string"
    description: "A single password (-p)"
    required: false
    flag: "-p"
    format: "flag"
  - name: "password_file"
    type: "string"
    description: "Password dictionary file (-P); prefer trying a small dictionary first"
    required: false
    flag: "-P"
    format: "flag"
  - name: "stop_on_first"
    type: "bool"
    description: "Exit immediately once a valid credential pair is found (-f, default true)"
    required: false
    flag: "-f"
    format: "flag"
    default: true
  - name: "tasks"
    type: "int"
    description: "Number of parallel connections per target (-t); 4 is recommended for SSH etc., default 4"
    required: false
    flag: "-t"
    format: "flag"
    default: 4
  - name: "wait_time"
    type: "int"
    description: "Seconds to wait for a response per connection (-w), default 16 (lower than Hydra's default of 32, to reduce the feeling of hanging)"
    required: false
    flag: "-w"
    format: "flag"
    default: 16
  - name: "wait_between"
    type: "int"
    description: "Seconds between connections per thread (-W), default 1"
    required: false
    flag: "-W"
    format: "flag"
    default: 1
  - name: "output_file"
    type: "string"
    description: "Write results to a file (-o); recommended for long-running tasks"
    required: false
    flag: "-o"
    format: "flag"
  - name: "target"
    type: "string"
    description: "Target IP, hostname, or CIDR (must come after the options)"
    required: true
    position: 1
    format: "positional"
  - name: "service"
    type: "string"
    description: "Service type (ssh, ftp, http-get, http-post-form, smb, etc.; see hydra -h)"
    required: true
    position: 2
    format: "positional"
  - name: "additional_args"
    type: "string"
    description: "Additional parameters (e.g. -s port, -S SSL, -m module options, -C login:pass file), appended to the end of the command"
    required: false
    format: "positional"
