name: "terrascan"
command: "terrascan"
enabled: true
short_description: "Infrastructure as Code security scanning tool"
description: |
  Terrascan是一个Infrastructure as Code security scanning tool，用于检测IaC配置中的安全问题。

  **Key Features:**
  - IaC security scanning
  - 多种框架支持
  - 策略检查
  - 合规性验证

  **Use Cases:**
  - IaC security scanning
  - Cloud configuration audit
  - Security policy checks
  - Compliance checking
parameters:
  - name: "scan_type"
    type: "string"
    description: "扫描类型（all, terraform, k8s等）"
    required: false
    flag: "--scan-type"
    format: "flag"
    default: "all"
  - name: "iac_dir"
    type: "string"
    description: "IaC目录"
    required: false
    flag: "-d"
    format: "flag"
    default: "."
  - name: "policy_type"
    type: "string"
    description: "要使用的策略类型"
    required: false
    flag: "--policy-type"
    format: "flag"
  - name: "output_format"
    type: "string"
    description: "输出格式（json, yaml, xml）"
    required: false
    flag: "--output"
    format: "flag"
    default: "json"
  - name: "severity"
    type: "string"
    description: "严重程度过滤（high, medium, low）"
    required: false
    flag: "--severity"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Additional terrascan parameters. Used to pass terrascan options not defined in the parameter list.

      **Example Values:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Multiple parameters are separated by spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
