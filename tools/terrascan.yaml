name: "terrascan"
command: "terrascan"
enabled: true
short_description: "Infrastructure as Code security scanning tool"
description: |
  Terrascan is an Infrastructure as Code security scanning tool used to detect security issues in IaC configurations.

  **Key Features:**
  - IaC security scanning
  - Support for multiple frameworks
  - Policy checking
  - Compliance validation

  **Use Cases:**
  - IaC security scanning
  - Cloud configuration audit
  - Security policy checks
  - Compliance checking
parameters:
  - name: "scan_type"
    type: "string"
    description: "scan type (all, terraform, k8s, etc.)"
    required: false
    flag: "--scan-type"
    format: "flag"
    default: "all"
  - name: "iac_dir"
    type: "string"
    description: "IaC directory"
    required: false
    flag: "-d"
    format: "flag"
    default: "."
  - name: "policy_type"
    type: "string"
    description: "policy type to use"
    required: false
    flag: "--policy-type"
    format: "flag"
  - name: "output_format"
    type: "string"
    description: "output format (json, yaml, xml)"
    required: false
    flag: "--output"
    format: "flag"
    default: "json"
  - name: "severity"
    type: "string"
    description: "severity filter (high, medium, low)"
    required: false
    flag: "--severity"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Additional terrascan parameters. Used to pass terrascan options not defined in the parameter list.

      **Example Values:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Multiple parameters are separated by spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
