name: "radare2"
command: "r2"
enabled: true
short_description: "二进制分析和逆向工程框架，支持反汇编、调试和脚本分析"
description: |
  Radare2是一个完整的二进制分析和逆向工程框架，支持多种架构和文件格式。

  **Key Features:**
  - Disassembly和反编译：支持多种架构（x86, ARM, MIPS等）
  - 调试支持：本地和远程调试
  - 脚本支持：支持r2pipe脚本和r2命令脚本
  - 多种文件格式：ELF, PE, Mach-O, 固件等
  - 交互式分析：命令行界面和可视化模式
  - 自动化分析：批量分析和脚本化分析

  **Use Cases:**
  - 二进制文件分析
  - Reverse engineering和漏洞研究
  - Malware analysis
  - CTF竞赛中的逆向题目
  - Firmware analysis
  - Exploit development

  **Notes:**
  - 可以使用 -c 参数执行命令后退出（非交互模式）
  - 可以使用 -i 参数执行脚本文件
  - 可以使用 -q 参数静默模式（不显示启动信息）
  - 可以使用 -A 参数自动分析二进制文件
  - 可以使用 -d 参数附加到进程进行调试
parameters:
  - name: "target"
    type: "string"
    description: |
      目标文件、进程ID或特殊值。

      **Format:**
      - 文件路径: "/path/to/binary"
      - 进程ID: "1234" (需要配合 -d 参数)
      - 特殊值: "-" (从stdin读取), "--" (交互模式), "=" (从环境变量读取)

      **Example Values:**
      - 二进制文件: "/tmp/vulnerable"
      - 进程调试: "1234" (配合 -d)
      - 从stdin: "-"

      **Notes:**
      - Required parameter, cannot be empty
      - 如果指定进程ID，需要配合 -d 参数使用
      - 注意：radare2 要求文件路径必须是最后一个参数，因此 target 使用 position 1
    required: true
    position: 1
    format: "positional"
  - name: "commands"
    type: "string"
    description: |
      要执行的Radare2命令。可以是单个命令或多个命令（用分号分隔）。

      **Format:**
      - 单个命令: "aaa" (自动分析)
      - 多个命令: "aaa; pdf @main; VV" (分析、反汇编main函数、可视化)

      **常用命令：**
      - "aaa": 自动分析所有函数
      - "afl": 列出所有函数
      - "pdf @main": 反汇编main函数
      - "px 64": 以十六进制显示64字节
      - "VV": 进入可视化模式
      - "i": 显示文件信息
      - "iz": 显示字符串

      **Example Values:**
      - "aaa" (自动分析)
      - "aaa; pdf @main" (分析并反汇编main函数)
      - "i; iz" (显示信息和字符串)

      **Notes:**
      - 多个命令用分号(;)分隔
      - 执行完命令后程序会退出（非交互模式）
    required: false
    flag: "-c"
    format: "flag"
  - name: "script_file"
    type: "string"
    description: |
      要执行的脚本文件路径。脚本文件包含Radare2命令，每行一个命令。

      **Format:**
      - 脚本文件路径: "/path/to/script.r2"

      **Example Values:**
      - "/tmp/analyze.r2"
      - "./scripts/auto_analyze.r2"

      **Notes:**
      - 脚本文件中的命令会按顺序执行
      - 脚本执行完后程序会退出
    required: false
    flag: "-i"
    format: "flag"
  - name: "arch"
    type: "string"
    description: |
      指定目标架构。

      **常用架构：**
      - "x86": 32位x86
      - "x86_64": 64位x86
      - "arm": ARM架构
      - "arm64": ARM64架构
      - "mips": MIPS架构
      - "ppc": PowerPC架构

      **Example Values:**
      - "x86"
      - "x86_64"
      - "arm"
      - "arm64"

      **Notes:**
      - If not specified, radare2 will attempt to auto-detect
      - 某些架构可能需要额外的配置
    required: false
    flag: "-a"
    format: "flag"
  - name: "bits"
    type: "int"
    description: |
      指定目标位数（16, 32, 64）。

      **Example Values:**
      - 16 (16位)
      - 32 (32位)
      - 64 (64位)

      **Notes:**
      - 通常与 -a 参数配合使用
      - If not specified, radare2 will attempt to auto-detect
    required: false
    flag: "-b"
    format: "flag"
  - name: "auto_analyze"
    type: "bool"
    description: |
      自动分析二进制文件。相当于执行 "aaa" 命令。

      **Use Cases:**
      - 快速分析二进制文件
      - Batch analysis

      **Notes:**
      - 启用后会自动分析所有函数
      - 可能需要较长时间
    required: false
    flag: "-A"
    format: "flag"
    default: false
  - name: "debug"
    type: "bool"
    description: |
      调试模式。可以附加到进程或调试文件。

      **Use Cases:**
      - 附加到运行中的进程
      - 调试二进制文件

      **Notes:**
      - 需要适当的权限
      - 如果target是进程ID，必须启用此选项
    required: false
    flag: "-d"
    format: "flag"
    default: false
  - name: "quiet"
    type: "bool"
    description: |
      静默模式。不显示启动信息和提示符。

      **Use Cases:**
      - 脚本化使用
      - Batch analysis
      - 自动化工具调用

      **Notes:**
      - 适合非交互式使用
      - 减少输出噪音
    required: false
    flag: "-q"
    format: "flag"
    default: false
  - name: "seek"
    type: "string"
    description: |
      设置起始地址。可以是十六进制地址或表达式。

      **Format:**
      - 十六进制: "0x400000"
      - 表达式: "main+0x10"

      **Example Values:**
      - "0x400000"
      - "main"
      - "0x1000"

      **Notes:**
      - 地址可以是十六进制或符号名
      - 用于从特定位置开始分析
    required: false
    flag: "-s"
    format: "flag"
  - name: "base_address"
    type: "string"
    description: |
      设置基址（base address）。用于加载地址。

      **Format:**
      - 十六进制地址: "0x400000"

      **Example Values:**
      - "0x400000"
      - "0x1000000"

      **Notes:**
      - 用于指定二进制文件的加载地址
      - 通常用于分析固件或内存转储
    required: false
    flag: "-B"
    format: "flag"
  - name: "eval"
    type: "string"
    description: |
      设置配置变量。格式为 key=value。

      **Format:**
      - "key=value"
      - 多个变量用空格分隔: "asm.arch=x86 asm.bits=32"

      **Example Values:**
      - "asm.arch=x86"
      - "asm.bits=32"
      - "scr.color=false"

      **Notes:**
      - 用于设置radare2的配置变量
      - 多个变量用空格分隔
    required: false
    flag: "-e"
    format: "flag"
  - name: "project"
    type: "string"
    description: |
      加载或保存项目文件。

      **Format:**
      - 项目文件路径: "/path/to/project.r2"

      **Example Values:**
      - "./project.r2"
      - "/tmp/analysis.r2"

      **Notes:**
      - 项目文件保存分析状态和配置
      - 可以用于恢复之前的分析
    required: false
    flag: "-p"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Additional radare2 parameters. Used to pass radare2 options not defined in the parameter list.

      **可用选项：**
      - "-C": 强制使用颜色输出
      - "-f": 强制打开文件（即使格式不匹配）
      - "-L": 列出支持的插件
      - "-M": 启用写模式
      - "-n": 不加载配置文件
      - "-N": 不执行脚本
      - "-S": 在调试模式下启动
      - "-t": 使用线程模式
      - "-u": 使用unicorn引擎
      - "-v": 显示版本信息
      - "-w": 写模式
      - "-z": 扫描字符串
      - "-X": 执行r2pipe脚本
      - "-P patch": 应用补丁
      - "-m maddr": 映射地址

      **Example Values:**
      - "-w" (写模式)
      - "-n" (不加载配置文件)
      - "-M" (启用写模式)
      - "-z" (扫描字符串)

      **Notes:**
      - Multiple parameters are separated by spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
