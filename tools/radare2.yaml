name: "radare2"
command: "r2"
enabled: true
short_description: "binary analysis and reverse-engineering framework, supports disassembly, debugging, and scripted analysis"
description: |
  Radare2 is a complete binary analysis and reverse-engineering framework that supports multiple architectures and file formats.

  **Key Features:**
  - Disassembly and decompilation: supports multiple architectures (x86, ARM, MIPS, etc.)
  - Debugging support: local and remote debugging
  - Script support: supports r2pipe scripts and r2 command scripts
  - Multiple file formats: ELF, PE, Mach-O, firmware, etc.
  - Interactive analysis: command-line interface and visual mode
  - Automated analysis: batch analysis and scripted analysis

  **Use Cases:**
  - Binary file analysis
  - Reverse engineering and vulnerability research
  - Malware analysis
  - Reverse-engineering challenges in CTF competitions
  - Firmware analysis
  - Exploit development

  **Notes:**
  - You can use the -c parameter to execute commands and then exit (non-interactive mode)
  - You can use the -i parameter to execute a script file
  - You can use the -q parameter for silent mode (does not show startup information)
  - You can use the -A parameter to automatically analyze the binary file
  - You can use the -d parameter to attach to a process for debugging
parameters:
  - name: "target"
    type: "string"
    description: |
      Target file, process ID, or special value.

      **Format:**
      - File path: "/path/to/binary"
      - Process ID: "1234" (requires the -d parameter)
      - Special values: "-" (read from stdin), "--" (interactive mode), "=" (read from environment variable)

      **Example Values:**
      - Binary file: "/tmp/vulnerable"
      - Process debugging: "1234" (with -d)
      - From stdin: "-"

      **Notes:**
      - Required parameter, cannot be empty
      - If a process ID is specified, it must be used with the -d parameter
      - Note: radare2 requires the file path to be the last argument, so target uses position 1
    required: true
    position: 1
    format: "positional"
  - name: "commands"
    type: "string"
    description: |
      The Radare2 command to execute. Can be a single command or multiple commands (semicolon-separated).

      **Format:**
      - Single command: "aaa" (automatic analysis)
      - Multiple commands: "aaa; pdf @main; VV" (analyze, disassemble the main function, visualize)

      **Common commands:**
      - "aaa": automatically analyze all functions
      - "afl": list all functions
      - "pdf @main": disassemble the main function
      - "px 64": display 64 bytes in hexadecimal
      - "VV": enter visual mode
      - "i": show file information
      - "iz": show strings

      **Example Values:**
      - "aaa" (automatic analysis)
      - "aaa; pdf @main" (analyze and disassemble the main function)
      - "i; iz" (show information and strings)

      **Notes:**
      - Separate multiple commands with a semicolon (;)
      - The program exits after executing the command (non-interactive mode)
    required: false
    flag: "-c"
    format: "flag"
  - name: "script_file"
    type: "string"
    description: |
      The path of the script file to execute. The script file contains Radare2 commands, one command per line.

      **Format:**
      - Script file path: "/path/to/script.r2"

      **Example Values:**
      - "/tmp/analyze.r2"
      - "./scripts/auto_analyze.r2"

      **Notes:**
      - Commands in the script file are executed in order
      - The program exits after the script finishes executing
    required: false
    flag: "-i"
    format: "flag"
  - name: "arch"
    type: "string"
    description: |
      Specify the target architecture.

      **Common architectures:**
      - "x86": 32-bit x86
      - "x86_64": 64-bit x86
      - "arm": ARM architecture
      - "arm64": ARM64 architecture
      - "mips": MIPS architecture
      - "ppc": PowerPC architecture

      **Example Values:**
      - "x86"
      - "x86_64"
      - "arm"
      - "arm64"

      **Notes:**
      - If not specified, radare2 will attempt to auto-detect
      - Some architectures may require additional configuration
    required: false
    flag: "-a"
    format: "flag"
  - name: "bits"
    type: "int"
    description: |
      Specify the target bit width (16, 32, 64).

      **Example Values:**
      - 16 (16-bit)
      - 32 (32-bit)
      - 64 (64-bit)

      **Notes:**
      - Usually used together with the -a parameter
      - If not specified, radare2 will attempt to auto-detect
    required: false
    flag: "-b"
    format: "flag"
  - name: "auto_analyze"
    type: "bool"
    description: |
      Automatically analyze the binary file. Equivalent to executing the "aaa" command.

      **Use Cases:**
      - Quickly analyze binary files
      - Batch analysis

      **Notes:**
      - When enabled, automatically analyzes all functions
      - May take a long time
    required: false
    flag: "-A"
    format: "flag"
    default: false
  - name: "debug"
    type: "bool"
    description: |
      Debug mode. Can attach to a process or debug a file.

      **Use Cases:**
      - Attach to a running process
      - Debug binary files

      **Notes:**
      - Requires appropriate privileges
      - If target is a process ID, this option must be enabled
    required: false
    flag: "-d"
    format: "flag"
    default: false
  - name: "quiet"
    type: "bool"
    description: |
      Silent mode. Does not show startup information or the prompt.

      **Use Cases:**
      - Scripted use
      - Batch analysis
      - Automated tool invocation

      **Notes:**
      - Suitable for non-interactive use
      - Reduce output noise
    required: false
    flag: "-q"
    format: "flag"
    default: false
  - name: "seek"
    type: "string"
    description: |
      Set the start address. Can be a hexadecimal address or an expression.

      **Format:**
      - Hexadecimal: "0x400000"
      - Expression: "main+0x10"

      **Example Values:**
      - "0x400000"
      - "main"
      - "0x1000"

      **Notes:**
      - The address can be a hexadecimal value or a symbol name
      - Used to start analysis from a specific location
    required: false
    flag: "-s"
    format: "flag"
  - name: "base_address"
    type: "string"
    description: |
      Set the base address. Used for the load address.

      **Format:**
      - Hexadecimal address: "0x400000"

      **Example Values:**
      - "0x400000"
      - "0x1000000"

      **Notes:**
      - Used to specify the load address of the binary file
      - Usually used to analyze firmware or memory dumps
    required: false
    flag: "-B"
    format: "flag"
  - name: "eval"
    type: "string"
    description: |
      Set configuration variables. The format is key=value.

      **Format:**
      - "key=value"
      - Separate multiple variables with spaces: "asm.arch=x86 asm.bits=32"

      **Example Values:**
      - "asm.arch=x86"
      - "asm.bits=32"
      - "scr.color=false"

      **Notes:**
      - Used to set radare2 configuration variables
      - Separate multiple variables with spaces
    required: false
    flag: "-e"
    format: "flag"
  - name: "project"
    type: "string"
    description: |
      Load or save a project file.

      **Format:**
      - Project file path: "/path/to/project.r2"

      **Example Values:**
      - "./project.r2"
      - "/tmp/analysis.r2"

      **Notes:**
      - The project file saves the analysis state and configuration
      - Can be used to restore a previous analysis
    required: false
    flag: "-p"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Additional radare2 parameters. Used to pass radare2 options not defined in the parameter list.

      **Available options:**
      - "-C": force colored output
      - "-f": force open the file (even if the format does not match)
      - "-L": list supported plugins
      - "-M": enable write mode
      - "-n": do not load the config file
      - "-N": do not execute scripts
      - "-S": start in debug mode
      - "-t": use threaded mode
      - "-u": use the unicorn engine
      - "-v": show version information
      - "-w": write mode
      - "-z": scan strings
      - "-X": execute an r2pipe script
      - "-P patch": apply a patch
      - "-m maddr": map address

      **Example Values:**
      - "-w" (write mode)
      - "-n" (do not load the config file)
      - "-M" (enable write mode)
      - "-z" (scan strings)

      **Notes:**
      - Multiple parameters are separated by spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
