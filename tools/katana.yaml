name: "katana"
command: "katana"
enabled: true
short_description: "next-generation web crawler and spider tool"
description: |
  Katana is a fast and intelligent web crawler used to discover endpoints and resources in web applications.

  **Key Features:**
  - Smart web crawler
  - JavaScript rendering support
  - Form extraction
  - Endpoint discovery

  **Use Cases:**
  - Web application reconnaissance
  - Endpoint discovery
  - Content crawling
  - Security testing
parameters:
  - name: "url"
    type: "string"
    description: "Target URL"
    required: true
    flag: "-u"
    format: "flag"
  - name: "depth"
    type: "int"
    description: "crawl depth"
    required: false
    flag: "-d"
    format: "flag"
    default: 3
  - name: "js_crawl"
    type: "bool"
    description: "enable JavaScript crawling"
    required: false
    flag: "-jc"
    format: "flag"
    default: true
  - name: "form_extraction"
    type: "bool"
    description: "enable form extraction (-fx / -form-extraction)"
    required: false
    flag: "-fx"
    format: "flag"
    default: true
  - name: "additional_args"
    type: "string"
    description: |
      Additional Katana parameters. Used to pass Katana options not defined in the parameter list.

      **Example Values:**
      - "-headless": use a headless browser
      - "-output-template '{{url}}'": custom output format
      - "-output output.txt": output to a file
      - "-c 20": concurrency

      **Notes:**
      - Multiple parameters are separated by spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
