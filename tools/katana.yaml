name: "katana"
command: "katana"
enabled: true
short_description: "下一代Web爬虫和蜘蛛工具"
description: |
  Katana是一个快速、智能的Web爬虫工具，用于发现Web应用中的端点和资源。

  **Key Features:**
  - 智能Web爬虫
  - JavaScript渲染支持
  - 表单提取
  - Endpoint discovery

  **Use Cases:**
  - Web应用侦察
  - Endpoint discovery
  - 内容爬取
  - Security testing
parameters:
  - name: "url"
    type: "string"
    description: "Target URL"
    required: true
    flag: "-u"
    format: "flag"
  - name: "depth"
    type: "int"
    description: "爬取深度"
    required: false
    flag: "-d"
    format: "flag"
    default: 3
  - name: "js_crawl"
    type: "bool"
    description: "启用JavaScript爬取"
    required: false
    flag: "-jc"
    format: "flag"
    default: true
  - name: "form_extraction"
    type: "bool"
    description: "启用表单提取（-fx / -form-extraction）"
    required: false
    flag: "-fx"
    format: "flag"
    default: true
  - name: "additional_args"
    type: "string"
    description: |
      Additional Katana parameters. Used to pass Katana options not defined in the parameter list.

      **Example Values:**
      - "-headless": 使用无头浏览器
      - "-output-template '{{url}}'": 自定义输出格式
      - "-output output.txt": 输出到文件
      - "-c 20": 并发数

      **Notes:**
      - Multiple parameters are separated by spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
