name: "kube-bench"
command: "kube-bench"
enabled: true
short_description: "CIS Kubernetes基准检查工具"
description: |
  Kube-bench是一个CIS Kubernetes基准检查工具，用于检查Kubernetes集群是否符合CIS基准。

  **Key Features:**
  - CIS基准检查
  - 多种目标支持（master, node, etcd, policies）
  - Detailed reporting
  - 配置验证

  **Use Cases:**
  - Kubernetes合规性检查
  - 安全配置审计
  - CIS基准验证
  - Security assessment
parameters:
  - name: "targets"
    type: "string"
    description: "要检查的目标（master, node, etcd, policies）"
    required: false
    flag: "--targets"
    format: "flag"
  - name: "version"
    type: "string"
    description: "Kubernetes版本"
    required: false
    flag: "--version"
    format: "flag"
  - name: "config_dir"
    type: "string"
    description: "配置目录"
    required: false
    flag: "--config-dir"
    format: "flag"
  - name: "output_format"
    type: "string"
    description: "Output format (json, yaml)"
    required: false
    flag: "--output"
    format: "flag"
    default: "json"
  - name: "additional_args"
    type: "string"
    description: |
      Additional kube-bench parameters. Used to pass kube-bench options not defined in the parameter list.

      **Example Values:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Multiple parameters are separated by spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
