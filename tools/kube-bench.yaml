name: "kube-bench"
command: "kube-bench"
enabled: true
short_description: "CIS Kubernetes benchmark checking tool"
description: |
  Kube-bench is a CIS Kubernetes benchmark checking tool used to check whether a Kubernetes cluster conforms to the CIS benchmark.

  **Key Features:**
  - CIS benchmark checks
  - Support for multiple targets (master, node, etcd, policies)
  - Detailed reporting
  - Configuration validation

  **Use Cases:**
  - Kubernetes compliance checks
  - Security configuration auditing
  - CIS benchmark validation
  - Security assessment
parameters:
  - name: "targets"
    type: "string"
    description: "target to check (master, node, etcd, policies)"
    required: false
    flag: "--targets"
    format: "flag"
  - name: "version"
    type: "string"
    description: "Kubernetes version"
    required: false
    flag: "--version"
    format: "flag"
  - name: "config_dir"
    type: "string"
    description: "config directory"
    required: false
    flag: "--config-dir"
    format: "flag"
  - name: "output_format"
    type: "string"
    description: "Output format (json, yaml)"
    required: false
    flag: "--output"
    format: "flag"
    default: "json"
  - name: "additional_args"
    type: "string"
    description: |
      Additional kube-bench parameters. Used to pass kube-bench options not defined in the parameter list.

      **Example Values:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Multiple parameters are separated by spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
