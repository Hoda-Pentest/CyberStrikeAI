name: "ropgadget"
command: "ROPgadget"
enabled: true
short_description: "ROP gadget搜索工具"
description: |
  ROPgadget是一个用于在二进制文件中搜索ROP gadget的工具。

  **Key Features:**
  - ROP gadget搜索
  - Multiple architecture support
  - Gadget分类
  - Exploit chain generation

  **Use Cases:**
  - Binary analysis
  - Exploit development
  - ROP chain construction
  - Security research
parameters:
  - name: "binary"
    type: "string"
    description: "Path to the binary file to analyze"
    required: true
    position: 0
    format: "positional"
  - name: "additional_args"
    type: "string"
    description: |
      Additional ropgadget parameters. Used to pass ropgadget options not defined in the parameter list.

      **Example Values:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Multiple parameters are separated by spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
