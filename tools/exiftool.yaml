name: "exiftool"
command: "exiftool"
enabled: true
short_description: "元数据提取工具"
description: |
  ExifTool用于读取、写入和编辑各种文件格式的元数据。

  **Key Features:**
  - 元数据提取
  - 多种文件格式支持
  - 元数据编辑
  - 批量处理

  **Use Cases:**
  - Forensic analysis
  - 元数据检查
  - 隐私保护
  - 文件分析
parameters:
  - name: "file_path"
    type: "string"
    description: "Path to the file to analyze"
    required: true
    position: 0
    format: "positional"
  - name: "output_json"
    type: "bool"
    description: "以JSON格式输出（等同于 -json）"
    required: false
    flag: "-json"
    format: "flag"
    default: false
  - name: "output_xml"
    type: "bool"
    description: "以XML格式输出（等同于 -X）"
    required: false
    flag: "-X"
    format: "flag"
    default: false
  - name: "output_csv"
    type: "bool"
    description: "以CSV格式输出（等同于 -csv）"
    required: false
    flag: "-csv"
    format: "flag"
    default: false
  - name: "tags"
    type: "string"
    description: "要提取的特定标签"
    required: false
    format: "template"
    template: "-{value}"
  - name: "additional_args"
    type: "string"
    description: |
      Additional exiftool parameters. Used to pass exiftool options not defined in the parameter list.

      **Example Values:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Multiple parameters are separated by spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
