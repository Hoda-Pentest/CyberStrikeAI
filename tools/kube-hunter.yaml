name: "kube-hunter"
command: "kube-hunter"
enabled: true
short_description: "Kubernetes penetration testing tool"
description: |
  Kube-hunter is a Kubernetes penetration testing tool used to discover security issues in Kubernetes clusters.

  **Key Features:**
  - Kubernetes security scanning
  - Vulnerability discovery
  - Configuration issue detection
  - Active and passive modes

  **Use Cases:**
  - Kubernetes security testing
  - Cluster security assessment
  - Penetration testing
  - Security audit
parameters:
  - name: "target"
    type: "string"
    description: "specific target scan"
    required: false
    flag: "--remote"
    format: "flag"
  - name: "cidr"
    type: "string"
    description: "CIDR range scan"
    required: false
    flag: "--cidr"
    format: "flag"
  - name: "interface"
    type: "string"
    description: "network interface scan"
    required: false
    flag: "--interface"
    format: "flag"
  - name: "active"
    type: "bool"
    description: "enable active scanning (may be risky)"
    required: false
    flag: "--active"
    format: "flag"
    default: false
  - name: "report"
    type: "string"
    description: "report format (json, yaml)"
    required: false
    flag: "--report"
    format: "flag"
    default: "json"
  - name: "additional_args"
    type: "string"
    description: |
      Additional kube-hunter parameters. Used to pass kube-hunter options not defined in the parameter list.

      **Example Values:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Multiple parameters are separated by spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
