name: "kube-hunter"
command: "kube-hunter"
enabled: true
short_description: "Kubernetes渗透测试工具"
description: |
  Kube-hunter是一个Kubernetes渗透测试工具，用于发现Kubernetes集群中的安全问题。

  **Key Features:**
  - Kubernetes安全扫描
  - Vulnerability discovery
  - 配置问题检测
  - 主动和被动模式

  **Use Cases:**
  - Kubernetes安全测试
  - 集群安全评估
  - Penetration testing
  - Security audit
parameters:
  - name: "target"
    type: "string"
    description: "特定目标扫描"
    required: false
    flag: "--remote"
    format: "flag"
  - name: "cidr"
    type: "string"
    description: "CIDR范围扫描"
    required: false
    flag: "--cidr"
    format: "flag"
  - name: "interface"
    type: "string"
    description: "网络接口扫描"
    required: false
    flag: "--interface"
    format: "flag"
  - name: "active"
    type: "bool"
    description: "启用主动扫描（可能有风险）"
    required: false
    flag: "--active"
    format: "flag"
    default: false
  - name: "report"
    type: "string"
    description: "报告格式（json, yaml）"
    required: false
    flag: "--report"
    format: "flag"
    default: "json"
  - name: "additional_args"
    type: "string"
    description: |
      Additional kube-hunter parameters. Used to pass kube-hunter options not defined in the parameter list.

      **Example Values:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Multiple parameters are separated by spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
