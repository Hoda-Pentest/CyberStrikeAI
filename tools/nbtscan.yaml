name: "nbtscan"
command: "nbtscan"
enabled: true
short_description: "NetBIOS name scanning tool"
description: |
  Nbtscan is a NetBIOS name scanning tool used to discover Windows systems on a network.

  **Key Features:**
  - NetBIOS name scanning
  - Windows system discovery
  - Network mapping
  - Quick scan

  **Use Cases:**
  - Windows network discovery
  - NetBIOS enumeration
  - Network mapping
  - Penetration testing
parameters:
  - name: "target"
    type: "string"
    description: "target IP address or range"
    required: true
    position: 0
    format: "positional"
  - name: "verbose"
    type: "bool"
    description: "verbose output"
    required: false
    flag: "-v"
    format: "flag"
    default: false
  - name: "timeout"
    type: "int"
    description: "timeout (seconds)"
    required: false
    flag: "-t"
    format: "flag"
    default: 2
  - name: "additional_args"
    type: "string"
    description: |
      Additional nbtscan parameters. Used to pass nbtscan options not defined in the parameter list.

      **Example Values:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Multiple parameters are separated by spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
