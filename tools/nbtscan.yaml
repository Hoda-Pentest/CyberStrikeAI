name: "nbtscan"
command: "nbtscan"
enabled: true
short_description: "NetBIOS名称扫描工具"
description: |
  Nbtscan是一个NetBIOS名称扫描工具，用于发现网络中的Windows系统。

  **Key Features:**
  - NetBIOS名称扫描
  - Windows系统发现
  - Network mapping
  - Quick scan

  **Use Cases:**
  - Windows网络发现
  - NetBIOS枚举
  - Network mapping
  - Penetration testing
parameters:
  - name: "target"
    type: "string"
    description: "目标IP地址或范围"
    required: true
    position: 0
    format: "positional"
  - name: "verbose"
    type: "bool"
    description: "详细输出"
    required: false
    flag: "-v"
    format: "flag"
    default: false
  - name: "timeout"
    type: "int"
    description: "超时时间（秒）"
    required: false
    flag: "-t"
    format: "flag"
    default: 2
  - name: "additional_args"
    type: "string"
    description: |
      Additional nbtscan parameters. Used to pass nbtscan options not defined in the parameter list.

      **Example Values:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Multiple parameters are separated by spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
