name: "xsser"
command: "xsser"
enabled: true
short_description: "XSS漏洞测试工具"
description: |
  XSSer是一个自动化XSS漏洞测试工具。

  **Key Features:**
  - XSS vulnerability detection
  - 多种XSS技术
  - Automated testing
  - Report generation

  **Use Cases:**
  - XSS vulnerability testing
  - Web application security testing
  - Penetration testing
  - Vulnerability verification
parameters:
  - name: "url"
    type: "string"
    description: "Target URL"
    required: true
    flag: "--url"
    format: "flag"
  - name: "params"
    type: "string"
    description: "要测试的参数"
    required: false
    flag: "--Fp"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Additional xsser parameters. Used to pass xsser options not defined in the parameter list.

      **Example Values:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Multiple parameters are separated by spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
