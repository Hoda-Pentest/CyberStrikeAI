name: "jwt-analyzer"
command: "jwt_tool"
enabled: true
short_description: "JWT令牌分析和漏洞测试工具"
description: |
  高级JWT令牌分析和漏洞测试工具，用于检测JWT实现中的安全问题。

  **Key Features:**
  - JWT令牌分析
  - 漏洞测试
  - 攻击向量检测
  - 令牌操作

  **Use Cases:**
  - JWT安全测试
  - 令牌分析
  - Vulnerability discovery
  - Security testing
parameters:
  - name: "jwt_token"
    type: "string"
    description: "要分析的JWT令牌"
    required: true
    flag: "-t"
    format: "flag"
  - name: "target_url"
    type: "string"
    description: "用于测试令牌操作的可选目标URL"
    required: false
    flag: "-u"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Additional jwt-analyzer parameters. Used to pass jwt-analyzer options not defined in the parameter list.

      **Example Values:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Multiple parameters are separated by spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
