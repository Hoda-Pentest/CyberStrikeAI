name: "ghidra"
command: "analyzeHeadless"
enabled: true
short_description: "高级二进制分析和逆向工程工具"
description: |
  Ghidra是NSA开发的免费二进制分析和逆向工程工具。

  **Key Features:**
  - Disassembly和反编译
  - 高级分析
  - 脚本支持
  - 协作功能

  **Use Cases:**
  - Binary analysis
  - Reverse engineering
  - Malware analysis
  - Vulnerability research
parameters:
  - name: "project_dir"
    type: "string"
    description: "Ghidra项目存放目录"
    required: false
    default: "/tmp/ghidra_projects"
    position: 0
    format: "positional"
  - name: "project_name"
    type: "string"
    description: "Ghidra项目名称"
    required: false
    default: "cyberstrike_analysis"
    position: 1
    format: "positional"
  - name: "binary"
    type: "string"
    description: "Path to the binary file to analyze"
    required: true
    flag: "-import"
    format: "flag"
  - name: "script_file"
    type: "string"
    description: "可选的Ghidra脚本文件（通过 -postScript 执行）"
    required: false
    flag: "-postScript"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Additional ghidra parameters. Used to pass ghidra options not defined in the parameter list.

      **Example Values:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Multiple parameters are separated by spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
