name: "subfinder"
command: "subfinder"
enabled: true
short_description: "passive subdomain discovery tool, uses multiple data sources"
description: |
  Subfinder is a passive subdomain discovery tool that discovers subdomains by querying multiple data sources.

  **Key Features:**
  - Passive subdomain discovery
  - Integration of multiple data sources
  - Quick scan
  - Supports API key configuration

  **Use Cases:**
  - Subdomain enumeration
  - Asset discovery
  - Bug bounty reconnaissance
  - Penetration testing reconnaissance
parameters:
  - name: "domain"
    type: "string"
    description: "Target domain"
    required: true
    flag: "-d"
    format: "flag"
  - name: "silent"
    type: "bool"
    description: "silent mode"
    required: false
    default: true
    flag: "-silent"
    format: "flag"
  - name: "all_sources"
    type: "bool"
    description: "use all data sources"
    required: false
    default: false
    flag: "-all"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: "extra Subfinder arguments"
    required: false
    format: "positional"
