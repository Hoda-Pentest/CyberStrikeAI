name: "cloudmapper"
command: "cloudmapper"
enabled: true
short_description: "AWS网络可视化和安全分析工具"
description: |
  CloudMapper是一个AWS网络可视化和安全分析工具。

  **Key Features:**
  - AWS网络可视化
  - 安全分析
  - Network mapping
  - 管理员查找

  **Use Cases:**
  - AWS网络分析
  - Security assessment
  - 网络可视化
  - Security audit
parameters:
  - name: "action"
    type: "string"
    description: "要执行的操作（collect, prepare, webserver, find_admins等）"
    required: false
    default: "collect"
    position: 0
    format: "positional"
  - name: "account"
    type: "string"
    description: "要分析的AWS账户"
    required: false
    flag: "--account"
    format: "flag"
  - name: "config"
    type: "string"
    description: "配置文件路径"
    required: false
    flag: "--config"
    format: "flag"
    default: "config.json"
  - name: "additional_args"
    type: "string"
    description: |
      Additional cloudmapper parameters. Used to pass cloudmapper options not defined in the parameter list.

      **Example Values:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Multiple parameters are separated by spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
