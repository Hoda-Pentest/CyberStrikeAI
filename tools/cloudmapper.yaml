name: "cloudmapper"
command: "cloudmapper"
enabled: true
short_description: "AWS network visualization and security analysis tool"
description: |
  CloudMapper is an AWS network visualization and security analysis tool.

  **Key Features:**
  - AWS network visualization
  - Security analysis
  - Network mapping
  - Administrator discovery

  **Use Cases:**
  - AWS network analysis
  - Security assessment
  - Network visualization
  - Security audit
parameters:
  - name: "action"
    type: "string"
    description: "operation to perform (collect, prepare, webserver, find_admins, etc.)"
    required: false
    default: "collect"
    position: 0
    format: "positional"
  - name: "account"
    type: "string"
    description: "AWS account to analyze"
    required: false
    flag: "--account"
    format: "flag"
  - name: "config"
    type: "string"
    description: "config file path"
    required: false
    flag: "--config"
    format: "flag"
    default: "config.json"
  - name: "additional_args"
    type: "string"
    description: |
      Additional cloudmapper parameters. Used to pass cloudmapper options not defined in the parameter list.

      **Example Values:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Multiple parameters are separated by spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
