name: "jaeles"
command: "jaeles"
args: ["scan"]
enabled: true
short_description: "advanced vulnerability scanner, supports custom signatures"
description: |
  Jaeles is an advanced vulnerability scanner that supports custom signatures for vulnerability detection.

  **Key Features:**
  - Custom signature support
  - Multiple vulnerability detections
  - Quick scan
  - Detailed reporting

  **Use Cases:**
  - Vulnerability scanning
  - Web application security testing
  - Custom detection rules
  - Security testing
parameters:
  - name: "url"
    type: "string"
    description: "Target URL"
    required: true
    flag: "-u"
    format: "flag"
  - name: "signatures"
    type: "string"
    description: "custom signature path"
    required: false
    flag: "-s"
    format: "flag"
  - name: "config"
    type: "string"
    description: "config file"
    required: false
    flag: "-c"
    format: "flag"
  - name: "threads"
    type: "int"
    description: "Number of threads"
    required: false
    flag: "-t"
    format: "flag"
    default: 20
  - name: "timeout"
    type: "int"
    description: "request timeout (seconds)"
    required: false
    flag: "--timeout"
    format: "flag"
    default: 20
  - name: "additional_args"
    type: "string"
    description: |
      Additional jaeles parameters. Used to pass jaeles options not defined in the parameter list.

      **Example Values:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Multiple parameters are separated by spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
