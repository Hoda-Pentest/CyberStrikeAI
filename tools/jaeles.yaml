name: "jaeles"
command: "jaeles"
args: ["scan"]
enabled: true
short_description: "高级漏洞扫描器，支持自定义签名"
description: |
  Jaeles是一个高级漏洞扫描器，支持自定义签名进行漏洞检测。

  **Key Features:**
  - 自定义签名支持
  - 多种漏洞检测
  - Quick scan
  - Detailed reporting

  **Use Cases:**
  - Vulnerability scanning
  - Web application security testing
  - 自定义检测规则
  - Security testing
parameters:
  - name: "url"
    type: "string"
    description: "Target URL"
    required: true
    flag: "-u"
    format: "flag"
  - name: "signatures"
    type: "string"
    description: "自定义签名路径"
    required: false
    flag: "-s"
    format: "flag"
  - name: "config"
    type: "string"
    description: "配置文件"
    required: false
    flag: "-c"
    format: "flag"
  - name: "threads"
    type: "int"
    description: "Number of threads"
    required: false
    flag: "-t"
    format: "flag"
    default: 20
  - name: "timeout"
    type: "int"
    description: "请求超时时间（秒）"
    required: false
    flag: "--timeout"
    format: "flag"
    default: 20
  - name: "additional_args"
    type: "string"
    description: |
      Additional jaeles parameters. Used to pass jaeles options not defined in the parameter list.

      **Example Values:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Multiple parameters are separated by spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
