name: "gobuster"
command: "gobuster"
enabled: false
short_description: "Web内容扫描工具，用于发现目录、文件和子域名"
description: |
  Gobuster是一个快速的内容发现工具，用于Web应用程序的目录、文件和子域名枚举。

  **Key Features:**
  - 目录和文件发现
  - DNS子域名枚举
  - Virtual host discovery
  - 支持多种模式（dir, dns, fuzz, vhost）

  **Use Cases:**
  - Web application security testing
  - Directory enumeration和文件发现
  - Subdomain discovery
  - Penetration testing reconnaissance
parameters:
  - name: "mode"
    type: "string"
    description: |
      扫描模式（Gobuster子命令），对应以下取值：
      - `dir`: 目录/文件枚举
      - `dns`: DNS子域名枚举
      - `fuzz`: 模板FUZZ扫描
      - `vhost`: 虚拟主机发现

      **注意：**
      Gobuster要求第一个参数为模式子命令，因此这里作为位置参数传递。
    required: false
    default: "dir"
    position: 0
    format: "positional"
    options: ["dir", "dns", "fuzz", "vhost"]
  - name: "url"
    type: "string"
    description: "Target URL"
    required: true
    flag: "-u"
    format: "flag"
  - name: "wordlist"
    type: "string"
    description: "Dictionary file path"
    required: false
    default: "/usr/share/wordlists/dirb/common.txt"
    flag: "-w"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: "额外的Gobuster参数"
    required: false
    format: "positional"
