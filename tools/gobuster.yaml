name: "gobuster"
command: "gobuster"
enabled: false
short_description: "Web content scanning tool, used to discover directories, files, and subdomains"
description: |
  Gobuster is a fast content discovery tool used for directory, file, and subdomain enumeration of web applications.

  **Key Features:**
  - Directory and file discovery
  - DNS subdomain enumeration
  - Virtual host discovery
  - Supports multiple modes (dir, dns, fuzz, vhost)

  **Use Cases:**
  - Web application security testing
  - Directory enumeration and file discovery
  - Subdomain discovery
  - Penetration testing reconnaissance
parameters:
  - name: "mode"
    type: "string"
    description: |
      Scan mode (Gobuster subcommand), corresponding to the following values:
      - `dir`: directory/file enumeration
      - `dns`: DNS subdomain enumeration
      - `fuzz`: template FUZZ scanning
      - `vhost`: virtual host discovery

      **Note:**
      Gobuster requires the first argument to be the mode subcommand, so it is passed here as a positional parameter.
    required: false
    default: "dir"
    position: 0
    format: "positional"
    options: ["dir", "dns", "fuzz", "vhost"]
  - name: "url"
    type: "string"
    description: "Target URL"
    required: true
    flag: "-u"
    format: "flag"
  - name: "wordlist"
    type: "string"
    description: "Dictionary file path"
    required: false
    default: "/usr/share/wordlists/dirb/common.txt"
    flag: "-w"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: "extra Gobuster arguments"
    required: false
    format: "positional"
