name: "dotdotpwn"
command: "dotdotpwn"
enabled: true
short_description: "目录遍历漏洞测试工具"
description: |
  DotDotPwn是一个目录遍历漏洞测试工具，支持多种协议。

  **Key Features:**
  - 目录遍历测试
  - 多种协议支持（HTTP, FTP, TFTP等）
  - Automated testing
  - Report generation

  **Use Cases:**
  - 目录遍历漏洞测试
  - Web application security testing
  - Penetration testing
  - Vulnerability verification
parameters:
  - name: "target"
    type: "string"
    description: "目标主机名或IP"
    required: true
    flag: "-h"
    format: "flag"
  - name: "module"
    type: "string"
    description: "要使用的模块（http, ftp, tftp等）"
    required: false
    flag: "-m"
    format: "flag"
    default: "http"
  - name: "additional_args"
    type: "string"
    description: |
      Additional dotdotpwn parameters. Used to pass dotdotpwn options not defined in the parameter list.

      **Example Values:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Multiple parameters are separated by spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
