name: "enum4linux-ng"
command: "enum4linux-ng"
enabled: true
short_description: "高级SMB枚举工具（Enum4linux的下一代版本）"
description: |
  Enum4linux-ng是Enum4linux的下一代版本，提供更强大的SMB枚举功能。

  **Key Features:**
  - SMB share enumeration
  - User and group enumeration
  - 策略枚举
  - System information gathering

  **Use Cases:**
  - Windows system penetration testing
  - SMB安全评估
  - Domain environment reconnaissance
  - Security testing
parameters:
  - name: "target"
    type: "string"
    description: "Target IP address"
    required: true
    position: 0
    format: "positional"
  - name: "username"
    type: "string"
    description: "Username"
    required: false
    flag: "-u"
    format: "flag"
  - name: "password"
    type: "string"
    description: "Password"
    required: false
    flag: "-p"
    format: "flag"
  - name: "domain"
    type: "string"
    description: "Domain"
    required: false
    flag: "-d"
    format: "flag"
  - name: "shares"
    type: "bool"
    description: "枚举共享"
    required: false
    flag: "-S"
    format: "flag"
    default: true
  - name: "users"
    type: "bool"
    description: "枚举用户"
    required: false
    flag: "-U"
    format: "flag"
    default: true
  - name: "groups"
    type: "bool"
    description: "枚举组"
    required: false
    flag: "-G"
    format: "flag"
    default: true
  - name: "policy"
    type: "bool"
    description: "枚举策略"
    required: false
    flag: "-P"
    format: "flag"
    default: true
  - name: "additional_args"
    type: "string"
    description: |
      Additional enum4linux-ng parameters. Used to pass enum4linux-ng options not defined in the parameter list.

      **Example Values:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Multiple parameters are separated by spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
