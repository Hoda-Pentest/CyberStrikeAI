name: "john"
command: "john"
enabled: true
short_description: "John the Ripper密码破解工具"
description: |
  John the Ripper是一个快速的密码破解工具，支持多种哈希算法。

  **Key Features:**
  - Multiple hash algorithm support
  - 字典攻击
  - 暴力破解
  - Rule engine

  **Use Cases:**
  - Password recovery
  - Hash cracking
  - Security testing
  - Forensic analysis
parameters:
  - name: "hash_file"
    type: "string"
    description: "File containing the hash"
    required: true
    position: 0
    format: "positional"
  - name: "wordlist"
    type: "string"
    description: "Dictionary file"
    required: false
    default: "/usr/share/wordlists/rockyou.txt"
    flag: "--wordlist"
    format: "flag"
  - name: "format_type"
    type: "string"
    description: "哈希格式类型"
    required: false
    flag: "--format"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: "额外的John参数"
    required: false
    format: "positional"
