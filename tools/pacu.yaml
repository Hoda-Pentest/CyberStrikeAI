name: "pacu"
command: "pacu"
enabled: false
short_description: "AWS渗透测试框架"
description: |
  Pacu是一个AWS渗透测试框架，用于测试AWS环境的安全性。

  **Key Features:**
  - AWS渗透测试
  - 权限提升
  - 数据访问
  - Modular architecture

  **Use Cases:**
  - AWS安全测试
  - Penetration testing
  - 权限测试
  - Security assessment
parameters:
  - name: "session_name"
    type: "string"
    description: "Pacu会话名称"
    required: false
    flag: "--session"
    format: "flag"
    default: "hexstrike_session"
  - name: "modules"
    type: "string"
    description: "要运行的模块（逗号分隔）"
    required: false
    flag: "--modules"
    format: "flag"
  - name: "regions"
    type: "string"
    description: "AWS区域（逗号分隔）"
    required: false
    flag: "--regions"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Additional pacu parameters. Used to pass pacu options not defined in the parameter list.

      **Example Values:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Multiple parameters are separated by spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
