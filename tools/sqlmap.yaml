name: "sqlmap"
command: "sqlmap"
enabled: true
# Short description (used in tool listings, reduces token usage)
short_description: "automated SQL injection detection and exploitation tool, used to discover and exploit SQL injection vulnerabilities"
# Detailed tool description
description: |
  Automated SQL injection detection and exploitation tool, used to discover and exploit SQL injection vulnerabilities.

  **Key Features:**
  - Automatically detect SQL injection vulnerabilities
  - Supports multiple database types (MySQL, PostgreSQL, Oracle, MSSQL, etc.)
  - Automatically extract database information (tables, columns, data)
  - Supports multiple injection techniques (boolean-based blind, time-based blind, union query, etc.)
  - Supports advanced features such as file upload/download and command execution

  **Use Cases:**
  - Web application security testing
  - SQL injection vulnerability detection
  - Database information gathering
  - Penetration testing and vulnerability verification

  **Notes:**
  - For authorized security testing only
  - Some operations may affect the target system
  - It is recommended to verify in a test environment first
  - Use the --batch parameter to avoid interactive prompts
# Parameter definitions
parameters:
  - name: "url"
    type: "string"
    description: |
      Target URL, containing parameters that may be vulnerable to SQL injection.

      **Format Requirements:**
      - A full URL, including the protocol (http:// or https://)
      - Must include query parameters; mark the injection point in the parameter value with *
      - Or provide a full URL directly, and sqlmap will automatically detect parameters

      **Example Values:**
      - Mark the injection point: "http://example.com/page?id=1*"
      - Full URL: "http://example.com/page?id=1"
      - POST data: "http://example.com/login" (requires the data parameter)
      - Cookie injection: "http://example.com/page" (requires the cookie parameter)

      **Notes:**
      - the URL must be accessible
      - Ensure the URL format is correct and includes the protocol prefix
      - If using a POST request, the data parameter must be used
      - Required parameter, cannot be empty
    required: true
    flag: "-u"
    format: "flag"
  - name: "batch"
    type: "bool"
    description: |
      Non-interactive mode, automatically selects the default options, no user input required.

      **Use Cases:**
      - Automated testing scripts
      - Batch scanning
      - Avoid interactive prompts

      **Notes:**
      - It is recommended to always set this to true to avoid the tool waiting for user input
      - The default value is true
    required: false
    default: true
    flag: "--batch"
    format: "flag"
  - name: "level"
    type: "int"
    description: |
      Test level, range 1-5; the higher the level, the more comprehensive the test but the longer it takes.

      **Level Description:**
      - Level 1: basic testing, fast but may miss vulnerabilities
      - Level 2: default level, balances speed and coverage
      - Level 3: extended testing, more comprehensive detection
      - Level 4: deep testing, includes more payloads
      - Level 5: most comprehensive testing, includes all known techniques

      **Recommendations:**
      - Quick scan uses 1-2
      - Use 3 for regular testing (default)
      - Use 4-5 for deep testing

      **Notes:**
      - The higher the level, the more requests, which may be blocked by a WAF
      - The default value is 3
    required: false
    default: 3
    flag: "--level"
    format: "combined" # --level=3
  - name: "data"
    type: "string"
    description: |
      POST data string, used for SQL injection detection of POST requests.

      **Format:**
      - Form data format, for example: "username=admin&password=123"
      - JSON format, for example: '{"username":"admin","password":"123"}'

      **Notes:**
      - If the URL uses the POST method, this parameter must be provided
      - Mark injection points in parameter values with *
    required: false
    flag: "--data"
    format: "flag"
  - name: "cookie"
    type: "string"
    description: |
      Cookie string, used for Cookie injection detection.

      **Format:**
      - Standard Cookie format, for example: "sessionid=abc123; user=admin"

      **Notes:**
      - If Cookie injection exists, this parameter must be provided
    required: false
    flag: "--cookie"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Additional SQLMap parameters. Used to pass SQLMap options not defined in the parameter list.

      **Example Values:**
      - "--dbs": list all databases
      - "--tables -D database": list tables of the specified database
      - "--dump -D database -T table": dump table data
      - "--os-shell": get an operating system shell
      - "--risk 2": risk level (1-3)
      - "--threads 10": number of concurrent threads
      - "--tamper space2comment": use a tamper script to bypass the WAF

      **Notes:**
      - Multiple parameters are separated by spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
