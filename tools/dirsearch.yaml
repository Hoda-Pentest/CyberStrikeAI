name: "dirsearch"
command: "dirsearch"
enabled: true
short_description: "高级目录和文件发现工具"
description: |
  Dirsearch是一个高级Web内容扫描器，用于发现目录和文件。

  **Key Features:**
  - Fast directory and file discovery
  - Multi-threading support
  - 递归扫描
  - Extension filtering

  **Use Cases:**
  - Web application security testing
  - Directory enumeration
  - File discovery
  - Penetration testing
parameters:
  - name: "url"
    type: "string"
    description: "Target URL"
    required: true
    flag: "-u"
    format: "flag"
  - name: "extensions"
    type: "string"
    description: "文件扩展名（逗号分隔）"
    required: false
    flag: "-e"
    format: "flag"
    default: "php,html,js,txt,xml,json"
  - name: "wordlist"
    type: "string"
    description: "Dictionary file path"
    required: false
    flag: "-w"
    format: "flag"
  - name: "threads"
    type: "int"
    description: "Number of threads"
    required: false
    flag: "-t"
    format: "flag"
    default: 30
  - name: "recursive"
    type: "bool"
    description: "启用递归扫描"
    required: false
    flag: "-r"
    format: "flag"
    default: false
  - name: "additional_args"
    type: "string"
    description: |
      Additional dirsearch parameters. Used to pass dirsearch options not defined in the parameter list.

      **Example Values:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Multiple parameters are separated by spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
