name: "waybackurls"
command: "waybackurls"
enabled: true
short_description: "从Wayback Machine获取历史URL"
description: |
  Waybackurls从Wayback Machine获取目标域名的历史URL。

  **Key Features:**
  - 历史URL发现
  - 版本获取
  - 子域名支持

  **Use Cases:**
  - Historical URL collection
  - Bug bounty reconnaissance
  - Security testing
  - Content discovery
parameters:
  - name: "domain"
    type: "string"
    description: "Target domain"
    required: true
    position: 0
    format: "positional"
  - name: "get_versions"
    type: "bool"
    description: "获取所有版本的URL"
    required: false
    flag: "-get-versions"
    format: "flag"
    default: false
  - name: "no_subs"
    type: "bool"
    description: "不包含子域名"
    required: false
    flag: "-no-subs"
    format: "flag"
    default: false
  - name: "additional_args"
    type: "string"
    description: |
      Additional waybackurls parameters. Used to pass waybackurls options not defined in the parameter list.

      **Example Values:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Multiple parameters are separated by spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
