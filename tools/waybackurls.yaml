name: "waybackurls"
command: "waybackurls"
enabled: true
short_description: "fetch historical URLs from the Wayback Machine"
description: |
  Waybackurls fetches the historical URLs of a target domain from the Wayback Machine.

  **Key Features:**
  - Historical URL discovery
  - Version retrieval
  - Subdomain support

  **Use Cases:**
  - Historical URL collection
  - Bug bounty reconnaissance
  - Security testing
  - Content discovery
parameters:
  - name: "domain"
    type: "string"
    description: "Target domain"
    required: true
    position: 0
    format: "positional"
  - name: "get_versions"
    type: "bool"
    description: "fetch URLs of all versions"
    required: false
    flag: "-get-versions"
    format: "flag"
    default: false
  - name: "no_subs"
    type: "bool"
    description: "do not include subdomains"
    required: false
    flag: "-no-subs"
    format: "flag"
    default: false
  - name: "additional_args"
    type: "string"
    description: |
      Additional waybackurls parameters. Used to pass waybackurls options not defined in the parameter list.

      **Example Values:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Multiple parameters are separated by spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
