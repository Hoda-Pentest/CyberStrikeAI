name: "rustscan"
command: "rustscan"
enabled: true
short_description: "ultra-fast port scanning (Rust); optional greppable, batch, and script level"
description: |
  RustScan 2.x: fast port discovery, with the option to then invoke Nmap scripts.

  **Correspondence with `rustscan -h`:**
  - `-a` / `--addresses`: scan target list (comma-separated or a file)
  - `-p`: comma-separated ports; `-r`: port range `start-end` (use either one, or combine with `-p` per the CLI)
  - `-g` / `--greppable`: output ports only, convenient for grep/piping
  - `--scripts`: **the official default is default** (runs Nmap); set to **none** for port discovery only, which is faster
  - `-b` batch-size, `-t` timeout, `--scan-order`, etc. fine-tune speed and order

  **Usage recommendations:**
  - Fast port scan without Nmap: use `none` for `scripts`, and add `-g` if necessary
  - When service identification/scripts are needed: use `default` or `custom`, and ensure nmap is available locally
parameters:
  # -a, --addresses
  - name: "target"
    type: "string"
    description: |
      Corresponds to `-a`: comma-separated CIDR, IP, or hostname; can also be a file path containing newlines/a list.
      Example: `192.168.1.1`, `10.0.0.1,10.0.0.2`, `192.168.0.0/24`
    required: true
    flag: "-a"
    format: "flag"
  # -p, --ports; for ranges use range (-r), do not put 1-1000 into ports
  - name: "ports"
    type: "string"
    description: |
      The ports to scan, **only** a comma-separated list, corresponding to `-p`.
      Example: `22,80,443`, `80,443,8080`.
      For a range such as `1-1000`, use the **range** parameter (`-r`); do not write it in this parameter.
    required: false
    flag: "-p"
    format: "flag"
  # -r, --range (use either this or the ports list, or combine per official docs)
  - name: "range"
    type: "string"
    description: |
      Port range, in the format start-end, corresponding to `-r`.
      Example: `1-1000`, `1-65535` (all ports is very slow).
      For discrete ports such as `22,80,443`, use **ports** (`-p`); do not write them in this parameter.
    required: false
    flag: "-r"
    format: "flag"
  # -u, --ulimit
  - name: "ulimit"
    type: "int"
    description: "ulimit for raising scan capacity; adjust according to the system's fd limit"
    required: false
    flag: "-u"
    format: "flag"
    default: 5000
  # --scripts: none | default | custom (CLI default is default)
  - name: "scripts"
    type: "string"
    description: |
      Script level; **must** be passed as a string, do not pass true/false.
      - **none**: do not run Nmap, port discovery only (fastest)
      - **default**: same as rustscan's official default, will invoke Nmap
      - **custom**: custom scripts, often need to be combined with additional_args
    required: false
    flag: "--scripts"
    format: "flag"
    default: "none"
    options:
      - "none"
      - "default"
      - "custom"
  # -g, --greppable: port list only, no Nmap output
  - name: "greppable"
    type: "bool"
    description: "Greppable mode: output ports only, suitable for script parsing or writing to a file"
    required: false
    flag: "-g"
    format: "flag"
    default: false
  # -b, --batch-size [default: 4500]
  - name: "batch_size"
    type: "int"
    description: "number of concurrent ports per batch; larger is faster, limited by the OS open-file limit. Official default is 4500"
    required: false
    flag: "-b"
    format: "flag"
  # -t, --timeout ms [default: 1500]
  - name: "timeout_ms"
    type: "int"
    description: "per-port timeout (milliseconds). Official default is 1500"
    required: false
    flag: "-t"
    format: "flag"
  # --scan-order serial | random [default: serial]
  - name: "scan_order"
    type: "string"
    description: "scan order: serial (ascending); random"
    required: false
    flag: "--scan-order"
    format: "flag"
    options:
      - "serial"
      - "random"
  # --top: top 1000 ports
  - name: "top_ports"
    type: "bool"
    description: "use the built-in top 1000 ports (equivalent to passing `--top`)"
    required: false
    flag: "--top"
    format: "flag"
    default: false
  # -e, --exclude-ports
  - name: "exclude_ports"
    type: "string"
    description: "excluded ports, comma-separated. Example: `80,443`"
    required: false
    flag: "-e"
    format: "flag"
  # -x, --exclude-addresses
  - name: "exclude_addresses"
    type: "string"
    description: "excluded addresses, comma-separated CIDR/IP/host"
    required: false
    flag: "-x"
    format: "flag"
  # --tries [default: 1]
  - name: "tries"
    type: "int"
    description: "number of retries before judging a port closed; 0 is corrected to 1"
    required: false
    flag: "--tries"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Options not listed above can be written here, space-separated.
      Example: `--no-banner`, `--udp`, `-n` (ignore the config file), `-c /path/config.toml`, `--resolver 8.8.8.8`
    required: false
    format: "positional"
