name: "hashpump"
command: "hashpump"
enabled: true
short_description: "哈希长度扩展攻击工具"
description: |
  HashPump是一个用于执行哈希长度扩展攻击的工具。

  **Key Features:**
  - 哈希长度扩展攻击
  - Multiple hash algorithm support
  - 签名生成
  - 数据追加

  **Use Cases:**
  - 密码学攻击
  - 哈希函数测试
  - CTF challenges
  - Security research
parameters:
  - name: "signature"
    type: "string"
    description: "原始哈希签名"
    required: true
    flag: "-s"
    format: "flag"
  - name: "data"
    type: "string"
    description: "原始数据"
    required: true
    flag: "-d"
    format: "flag"
  - name: "key_length"
    type: "int"
    description: "密钥长度"
    required: true
    flag: "-k"
    format: "flag"
  - name: "append_data"
    type: "string"
    description: "要追加的数据"
    required: true
    flag: "-a"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Additional hashpump parameters. Used to pass hashpump options not defined in the parameter list.

      **Example Values:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Multiple parameters are separated by spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
