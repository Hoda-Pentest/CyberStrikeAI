name: "objdump"
command: "objdump"
enabled: true
short_description: "二进制文件反汇编工具"
description: |
  Objdump是GNU binutils的一部分，用于反汇编二进制文件。

  **Key Features:**
  - Disassembly
  - 符号表显示
  - 节信息显示
  - Multiple architecture support

  **Use Cases:**
  - Binary analysis
  - Reverse engineering
  - 程序理解
  - 调试辅助
parameters:
  - name: "binary"
    type: "string"
    description: "Path to the binary file to analyze"
    required: true
    position: 0
    format: "positional"
  - name: "disassemble"
    type: "bool"
    description: "反汇编二进制文件"
    required: false
    flag: "-d"
    format: "flag"
    default: true
  - name: "additional_args"
    type: "string"
    description: |
      Additional objdump parameters. Used to pass objdump options not defined in the parameter list.

      **Example Values:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Multiple parameters are separated by spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
