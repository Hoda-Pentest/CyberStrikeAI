name: "objdump"
command: "objdump"
enabled: true
short_description: "binary file disassembly tool"
description: |
  Objdump is part of GNU binutils, used to disassemble binary files.

  **Key Features:**
  - Disassembly
  - Symbol table display
  - Section information display
  - Multiple architecture support

  **Use Cases:**
  - Binary analysis
  - Reverse engineering
  - Program comprehension
  - Debugging assistance
parameters:
  - name: "binary"
    type: "string"
    description: "Path to the binary file to analyze"
    required: true
    position: 0
    format: "positional"
  - name: "disassemble"
    type: "bool"
    description: "disassemble a binary file"
    required: false
    flag: "-d"
    format: "flag"
    default: true
  - name: "additional_args"
    type: "string"
    description: |
      Additional objdump parameters. Used to pass objdump options not defined in the parameter list.

      **Example Values:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Multiple parameters are separated by spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
