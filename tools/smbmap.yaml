name: "smbmap"
command: "smbmap"
enabled: true
short_description: "SMB共享枚举和访问工具"
description: |
  SMBMap是一个用于枚举SMB共享并提供文件访问功能的工具。

  **Key Features:**
  - SMB share enumeration
  - 文件列表和下载
  - 权限检查
  - 支持多种认证方式

  **Use Cases:**
  - SMB安全测试
  - 文件共享审计
  - Penetration testing
  - Network reconnaissance
parameters:
  - name: "target"
    type: "string"
    description: "Target IP address"
    required: true
    flag: "-H"
    format: "flag"
  - name: "username"
    type: "string"
    description: "Username"
    required: false
    flag: "-u"
    format: "flag"
  - name: "password"
    type: "string"
    description: "Password"
    required: false
    flag: "-p"
    format: "flag"
  - name: "domain"
    type: "string"
    description: "Domain"
    required: false
    flag: "-d"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: "额外的SMBMap参数"
    required: false
    format: "positional"
