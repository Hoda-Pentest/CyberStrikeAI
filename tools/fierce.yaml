name: "fierce"
command: "fierce"
enabled: true
short_description: "DNS侦察工具"
description: |
  Fierce是一个DNS侦察工具，用于发现目标域名的子域名。

  **Key Features:**
  - Subdomain discovery
  - DNS暴力破解
  - Zone transfer testing
  - Network mapping

  **Use Cases:**
  - DNS侦察
  - Subdomain enumeration
  - Network mapping
  - Penetration testing
parameters:
  - name: "domain"
    type: "string"
    description: "Target domain"
    required: true
    flag: "-dns"
    format: "flag"
  - name: "dns_server"
    type: "string"
    description: "DNS server to use"
    required: false
    flag: "-dnsserver"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Additional fierce parameters. Used to pass fierce options not defined in the parameter list.

      **Example Values:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Multiple parameters are separated by spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
