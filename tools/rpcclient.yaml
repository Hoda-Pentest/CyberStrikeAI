name: "rpcclient"
command: "python3"
args:
  - "-c"
  - |
    import shlex
    import subprocess
    import sys

    if len(sys.argv) < 2:
        sys.stderr.write("缺少目标地址\n")
        sys.exit(1)

    target = sys.argv[1]
    username = sys.argv[2] if len(sys.argv) > 2 else ""
    password = sys.argv[3] if len(sys.argv) > 3 else ""
    domain = sys.argv[4] if len(sys.argv) > 4 else ""
    commands = sys.argv[5] if len(sys.argv) > 5 else ""
    extra = sys.argv[6] if len(sys.argv) > 6 else ""

    cmd = ["rpcclient"]

    if username:
        cred = username
        if password:
            cred = f"{username}%{password}"
        cmd.extend(["-U", cred])
    elif password:
        # 如果只提供了密码，仍然尝试以空用户名连接
        cmd.extend(["-U", f"%{password}"])

    if domain:
        cmd.extend(["-W", domain])

    if commands:
        cmd.extend(["-c", commands])

    if extra:
        cmd.extend(shlex.split(extra))

    cmd.append(target)

    proc = subprocess.run(cmd, capture_output=True, text=True)
    if proc.stdout:
        sys.stdout.write(proc.stdout)
    if proc.stderr:
        sys.stderr.write(proc.stderr)
    sys.exit(proc.returncode)
enabled: true
short_description: "RPC枚举工具"
description: |
  Rpcclient是一个RPC客户端工具，用于枚举Windows/Samba系统信息。

  **Key Features:**
  - RPC枚举
  - User and group enumeration
  - 域信息查询
  - System information gathering

  **Use Cases:**
  - Windows system penetration testing
  - Samba枚举
  - Domain environment reconnaissance
  - Security testing
parameters:
  - name: "target"
    type: "string"
    description: "Target IP address"
    required: true
    position: 0
    format: "positional"
  - name: "username"
    type: "string"
    description: "Username"
    required: false
    default: ""
    position: 1
    format: "positional"
  - name: "password"
    type: "string"
    description: "Password"
    required: false
    default: ""
    position: 2
    format: "positional"
  - name: "domain"
    type: "string"
    description: "Domain"
    required: false
    default: ""
    position: 3
    format: "positional"
  - name: "commands"
    type: "string"
    description: "RPC命令（分号分隔）"
    required: false
    default: "enumdomusers;enumdomgroups;querydominfo"
    position: 4
    format: "positional"
  - name: "additional_args"
    type: "string"
    description: |
      Additional rpcclient parameters. Used to pass rpcclient options not defined in the parameter list.

      **Example Values:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Multiple parameters are separated by spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    default: ""
    position: 5
    format: "positional"
