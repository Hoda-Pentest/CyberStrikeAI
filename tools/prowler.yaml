name: "prowler"
command: "prowler"
enabled: true
short_description: "cloud security assessment tool (AWS, Azure, GCP)"
description: |
  Prowler is a comprehensive cloud security assessment tool that supports AWS, Azure, and GCP.

  **Key Features:**
  - Cloud security assessment
  - Compliance checking
  - Security best-practice checks
  - Multiple output formats

  **Use Cases:**
  - Cloud security audit
  - Compliance checking
  - Security assessment
  - Cloud configuration audit
parameters:
  - name: "provider"
    type: "string"
    description: "cloud provider (aws, azure, gcp)"
    required: false
    default: "aws"
    position: 0
    format: "positional"
  - name: "profile"
    type: "string"
    description: "AWS configuration profile"
    required: false
    flag: "-p"
    format: "flag"
    default: "default"
  - name: "region"
    type: "string"
    description: "specific region to scan"
    required: false
    flag: "-r"
    format: "flag"
  - name: "checks"
    type: "string"
    description: "Specific check to run"
    required: false
    flag: "-c"
    format: "flag"
  - name: "output_format"
    type: "string"
    description: "output format (json, csv, html)"
    required: false
    flag: "-M"
    format: "flag"
    default: "json"
  - name: "additional_args"
    type: "string"
    description: |
      Additional prowler parameters. Used to pass prowler options not defined in the parameter list.

      **Example Values:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Multiple parameters are separated by spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
