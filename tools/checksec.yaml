name: "checksec"
command: "checksec"
enabled: true
short_description: "二进制安全特性检查工具"
description: |
  Checksec是一个用于检查二进制文件安全特性的工具。

  **Key Features:**
  - 安全特性检查
  - 保护机制检测
  - Multiple architecture support
  - Detailed reporting

  **Use Cases:**
  - 二进制安全分析
  - 保护机制检查
  - Vulnerability research
  - Security assessment
parameters:
  - name: "binary"
    type: "string"
    description: "要检查的二进制文件路径"
    required: true
    position: 0
    format: "positional"
  - name: "additional_args"
    type: "string"
    description: |
      Additional checksec parameters. Used to pass checksec options not defined in the parameter list.

      **Example Values:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Multiple parameters are separated by spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
