name: "steghide"
command: "steghide"
enabled: true
short_description: "隐写术分析工具"
description: |
  Steghide是一个隐写术工具，用于在图像和音频文件中隐藏数据。

  **Key Features:**
  - 数据隐藏
  - Data extraction
  - 信息查看
  - 密码保护

  **Use Cases:**
  - 隐写术分析
  - 数据隐藏检测
  - Forensic analysis
  - CTF challenges
parameters:
  - name: "action"
    type: "string"
    description: "操作类型（extract, embed, info）"
    required: true
    position: 0
    format: "positional"
  - name: "cover_file"
    type: "string"
    description: "载体文件路径（embed/info操作使用 -cf）"
    required: false
    flag: "-cf"
    format: "flag"
  - name: "embed_file"
    type: "string"
    description: "要嵌入的文件（embed操作时）"
    required: false
    flag: "-ef"
    format: "flag"
  - name: "passphrase"
    type: "string"
    description: "Password"
    required: false
    flag: "-p"
    format: "flag"
  - name: "stego_file"
    type: "string"
    description: "隐写文件路径（embed时输出，extract时输入）"
    required: false
    flag: "-sf"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Additional steghide parameters. Used to pass steghide options not defined in the parameter list.

      **Example Values:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Multiple parameters are separated by spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
