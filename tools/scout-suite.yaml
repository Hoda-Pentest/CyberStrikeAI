name: "scout-suite"
command: "scout"
enabled: true
short_description: "多云安全评估工具"
description: |
  Scout Suite是一个多云安全评估工具，支持AWS、Azure、GCP、Aliyun和OCI。

  **Key Features:**
  - 多云安全评估
  - 配置审计
  - Security best-practice checks
  - Detailed reporting生成

  **Use Cases:**
  - Cloud security audit
  - Compliance checking
  - Security assessment
  - Cloud configuration audit
parameters:
  - name: "provider"
    type: "string"
    description: "云提供商（aws, azure, gcp, aliyun, oci）"
    required: false
    flag: "--provider"
    format: "flag"
    default: "aws"
  - name: "profile"
    type: "string"
    description: "AWS configuration profile"
    required: false
    flag: "--profile"
    format: "flag"
    default: "default"
  - name: "report_dir"
    type: "string"
    description: "报告保存目录"
    required: false
    flag: "--report-dir"
    format: "flag"
    default: "/tmp/scout-suite"
  - name: "services"
    type: "string"
    description: "要评估的特定服务"
    required: false
    flag: "--services"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Additional scout-suite parameters. Used to pass scout-suite options not defined in the parameter list.

      **Example Values:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Multiple parameters are separated by spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
