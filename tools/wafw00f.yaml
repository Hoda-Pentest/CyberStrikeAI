name: "wafw00f"
command: "wafw00f"
enabled: true
short_description: "WAF识别和指纹识别工具"
description: |
  Wafw00f是一个Web应用防火墙（WAF）识别和指纹识别工具。

  **Key Features:**
  - WAF检测
  - WAF指纹识别
  - 多种WAF支持
  - 绕过技术检测

  **Use Cases:**
  - WAF识别
  - Security testing
  - Penetration testing
  - Security assessment
parameters:
  - name: "target"
    type: "string"
    description: "Target URL or IP"
    required: true
    position: 0
    format: "positional"
  - name: "additional_args"
    type: "string"
    description: |
      Additional wafw00f parameters. Used to pass wafw00f options not defined in the parameter list.

      **Example Values:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Multiple parameters are separated by spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
