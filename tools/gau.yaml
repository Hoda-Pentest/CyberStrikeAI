name: "gau"
command: "gau"
enabled: true
short_description: "从多个数据源获取所有URL"
description: |
  Gau (Get All URLs) 从多个数据源获取目标域名的所有URL。

  **Key Features:**
  - 从Wayback Machine获取URL
  - 从CommonCrawl获取URL
  - 从OTX获取URL
  - 从URLScan获取URL

  **Use Cases:**
  - URL发现
  - Historical URL collection
  - Bug bounty reconnaissance
  - Security testing
parameters:
  - name: "domain"
    type: "string"
    description: "Target domain"
    required: true
    position: 0
    format: "positional"
  - name: "providers"
    type: "string"
    description: "数据源（wayback,commoncrawl,otx,urlscan）"
    required: false
    flag: "--providers"
    format: "flag"
  - name: "include_subs"
    type: "bool"
    description: "包含子域名"
    required: false
    flag: "--subs"
    format: "flag"
    default: true
  - name: "additional_args"
    type: "string"
    description: |
      Additional Gau parameters. Used to pass Gau options not defined in the parameter list.

      **Example Values:**
      - "--o output.txt": 输出到文件
      - "--threads 4": Number of threads
      - "--blacklist ttf,woff,svg,png": 黑名单扩展

      **Notes:**
      - Multiple parameters are separated by spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
