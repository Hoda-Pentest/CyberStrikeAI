name: "gau"
command: "gau"
enabled: true
short_description: "fetch all URLs from multiple data sources"
description: |
  Gau (Get All URLs) fetches all URLs of a target domain from multiple data sources.

  **Key Features:**
  - Fetch URLs from the Wayback Machine
  - Fetch URLs from CommonCrawl
  - Fetch URLs from OTX
  - Fetch URLs from URLScan

  **Use Cases:**
  - URL discovery
  - Historical URL collection
  - Bug bounty reconnaissance
  - Security testing
parameters:
  - name: "domain"
    type: "string"
    description: "Target domain"
    required: true
    position: 0
    format: "positional"
  - name: "providers"
    type: "string"
    description: "data sources (wayback,commoncrawl,otx,urlscan)"
    required: false
    flag: "--providers"
    format: "flag"
  - name: "include_subs"
    type: "bool"
    description: "include subdomains"
    required: false
    flag: "--subs"
    format: "flag"
    default: true
  - name: "additional_args"
    type: "string"
    description: |
      Additional Gau parameters. Used to pass Gau options not defined in the parameter list.

      **Example Values:**
      - "--o output.txt": output to a file
      - "--threads 4": Number of threads
      - "--blacklist ttf,woff,svg,png": blacklist extensions

      **Notes:**
      - Multiple parameters are separated by spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
