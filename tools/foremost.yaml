name: "foremost"
command: "foremost"
enabled: true
short_description: "文件恢复工具"
description: |
  Foremost是一个基于文件头和尾的文件恢复工具。

  **Key Features:**
  - 文件恢复
  - 多种文件类型支持
  - 磁盘镜像分析
  - Data recovery

  **Use Cases:**
  - Data recovery
  - Forensic analysis
  - File extraction
  - 磁盘分析
parameters:
  - name: "input_file"
    type: "string"
    description: "输入文件或设备"
    required: true
    flag: "-i"
    format: "flag"
  - name: "output_dir"
    type: "string"
    description: "输出目录"
    required: false
    flag: "-o"
    format: "flag"
    default: "/tmp/foremost_output"
  - name: "file_types"
    type: "string"
    description: "要恢复的文件类型（jpg,gif,png等）"
    required: false
    flag: "-t"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Additional foremost parameters. Used to pass foremost options not defined in the parameter list.

      **Example Values:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Multiple parameters are separated by spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
