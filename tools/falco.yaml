name: "falco"
command: "falco"
enabled: true
short_description: "运行时安全监控工具"
description: |
  Falco是一个运行时安全监控工具，用于检测容器和主机中的异常行为。

  **Key Features:**
  - 运行时监控
  - Anomaly detection
  - Rule engine
  - 实时告警

  **Use Cases:**
  - 运行时安全监控
  - Anomaly detection
  - 安全事件响应
  - 合规性监控
parameters:
  - name: "config_file"
    type: "string"
    description: "Falco配置文件"
    required: false
    flag: "--config"
    format: "flag"
    default: "/etc/falco/falco.yaml"
  - name: "rules_file"
    type: "string"
    description: "自定义规则文件"
    required: false
    flag: "--rules"
    format: "flag"
  - name: "json_output"
    type: "bool"
    description: "以JSON格式输出（等同于 -o json_output=true）"
    required: false
    flag: "-o json_output=true"
    format: "flag"
    default: true
  - name: "duration"
    type: "int"
    description: "监控持续时间（秒）"
    required: false
    flag: "--duration"
    format: "flag"
    default: 60
  - name: "additional_args"
    type: "string"
    description: |
      Additional falco parameters. Used to pass falco options not defined in the parameter list.

      **Example Values:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Multiple parameters are separated by spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
