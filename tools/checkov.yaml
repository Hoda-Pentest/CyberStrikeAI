name: "checkov"
command: "checkov"
enabled: true
short_description: "Infrastructure as Code security scanning tool"
description: |
  Checkov是一个静态代码分析工具，用于基础设施即代码（IaC）的安全扫描。

  **Key Features:**
  - 支持多种IaC框架（Terraform, CloudFormation, Kubernetes等）
  - 数百个内置策略
  - 自定义策略支持
  - CI/CD integration

  **Use Cases:**
  - IaC security scanning
  - Cloud configuration audit
  - Security policy checks
  - Compliance checking
parameters:
  - name: "directory"
    type: "string"
    description: "要扫描的目录"
    required: false
    flag: "-d"
    format: "flag"
    default: "."
  - name: "framework"
    type: "string"
    description: "要扫描的框架（terraform, cloudformation, kubernetes等）"
    required: false
    flag: "--framework"
    format: "flag"
  - name: "check"
    type: "string"
    description: "Specific check to run"
    required: false
    flag: "--check"
    format: "flag"
  - name: "output_format"
    type: "string"
    description: "输出格式（json, yaml, cli）"
    required: false
    flag: "--output"
    format: "flag"
    default: "json"
  - name: "additional_args"
    type: "string"
    description: |
      Additional checkov parameters. Used to pass checkov options not defined in the parameter list.

      **Example Values:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Multiple parameters are separated by spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
