name: "checkov"
command: "checkov"
enabled: true
short_description: "Infrastructure as Code security scanning tool"
description: |
  Checkov is a static code analysis tool used for security scanning of infrastructure as code (IaC).

  **Key Features:**
  - Supports multiple IaC frameworks (Terraform, CloudFormation, Kubernetes, etc.)
  - Hundreds of built-in policies
  - Custom policy support
  - CI/CD integration

  **Use Cases:**
  - IaC security scanning
  - Cloud configuration audit
  - Security policy checks
  - Compliance checking
parameters:
  - name: "directory"
    type: "string"
    description: "directory to scan"
    required: false
    flag: "-d"
    format: "flag"
    default: "."
  - name: "framework"
    type: "string"
    description: "framework to scan (terraform, cloudformation, kubernetes, etc.)"
    required: false
    flag: "--framework"
    format: "flag"
  - name: "check"
    type: "string"
    description: "Specific check to run"
    required: false
    flag: "--check"
    format: "flag"
  - name: "output_format"
    type: "string"
    description: "output format (json, yaml, cli)"
    required: false
    flag: "--output"
    format: "flag"
    default: "json"
  - name: "additional_args"
    type: "string"
    description: |
      Additional checkov parameters. Used to pass checkov options not defined in the parameter list.

      **Example Values:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Multiple parameters are separated by spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
