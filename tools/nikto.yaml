name: "nikto"
command: "nikto"
enabled: true
# 允许的退出码列表：nikto在找到漏洞时会返回退出码1，这是正常的成功状态
allowed_exit_codes: [1]
# Short description (used in tool listings, reduces token usage)
short_description: "Web服务器扫描工具，用于检测Web服务器和应用程序中的已知漏洞和配置错误"
# Detailed tool description
description: |
  Web服务器扫描工具，用于检测Web服务器和应用程序中的已知漏洞、配置错误和潜在安全问题。

  **Key Features:**
  - 检测Web服务器版本和配置问题
  - 识别已知的Web漏洞和CVE
  - 检测危险文件和目录
  - 检查服务器配置错误
  - 识别过时的软件版本
  - 检测默认文件和脚本

  **Use Cases:**
  - Web应用安全评估
  - 服务器配置审计
  - Vulnerability scanning and discovery
  - Penetration testing前期信息收集

  **Notes:**
  - 扫描可能产生大量日志，注意日志管理
  - 某些扫描可能触发WAF或IDS告警
  - 建议在授权范围内使用
  - 扫描结果需要人工验证
# Parameter definitions
parameters:
  - name: "target"
    type: "string"
    description: |
      目标URL or IP地址。可以是完整的URL或IP地址。

      **Format Requirements:**
      - 可以包含协议（http:// 或 https://）
      - 可以只提供IP地址或域名
      - 如果只提供IP，默认使用http协议

      **Example Values:**
      - 完整URL: "http://example.com"
      - HTTPS: "https://example.com"
      - IP地址: "192.168.1.1"
      - 带端口: "http://example.com:8080"
      - 带路径: "http://example.com/admin"

      **Notes:**
      - 如果只提供IP，工具会使用http协议
      - 建议提供完整URL以确保正确扫描
      - Required parameter, cannot be empty
    required: true
    flag: "-h"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Additional nikto parameters. Used to pass nikto options not defined in the parameter list.

      **Example Values:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Multiple parameters are separated by spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
