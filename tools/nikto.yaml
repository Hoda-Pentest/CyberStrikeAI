name: "nikto"
command: "nikto"
enabled: true
# list of allowed exit codes: nikto returns exit code 1 when it finds vulnerabilities, which is a normal success state
allowed_exit_codes: [1]
# Short description (used in tool listings, reduces token usage)
short_description: "Web server scanning tool, used to detect known vulnerabilities and misconfigurations in web servers and applications"
# Detailed tool description
description: |
  Web server scanning tool used to detect known vulnerabilities, misconfigurations, and potential security issues in web servers and applications.

  **Key Features:**
  - Detect web server version and configuration issues
  - Identify known web vulnerabilities and CVEs
  - Detect dangerous files and directories
  - Check for server misconfigurations
  - Identify outdated software versions
  - Detect default files and scripts

  **Use Cases:**
  - Web application security assessment
  - Server configuration auditing
  - Vulnerability scanning and discovery
  - Early-stage information gathering in penetration testing

  **Notes:**
  - Scanning may produce a large amount of logs; pay attention to log management
  - Some scans may trigger WAF or IDS alerts
  - It is recommended to use within the authorized scope
  - Scan results require manual verification
# Parameter definitions
parameters:
  - name: "target"
    type: "string"
    description: |
      Target URL or IP address. Can be a full URL or an IP address.

      **Format Requirements:**
      - Can include the protocol (http:// or https://)
      - You can provide only an IP address or domain name
      - If only an IP is provided, the http protocol is used by default

      **Example Values:**
      - Full URL: "http://example.com"
      - HTTPS: "https://example.com"
      - IP address: "192.168.1.1"
      - With a port: "http://example.com:8080"
      - With a path: "http://example.com/admin"

      **Notes:**
      - If only an IP is provided, the tool uses the http protocol
      - It is recommended to provide a full URL to ensure correct scanning
      - Required parameter, cannot be empty
    required: true
    flag: "-h"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Additional nikto parameters. Used to pass nikto options not defined in the parameter list.

      **Example Values:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Multiple parameters are separated by spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
