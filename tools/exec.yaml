name: "exec"
command: "sh"
args: ["-c"]
enabled: true
# Short description (used in tool listings, reduces token usage)
short_description: "system command execution tool, used to execute shell commands and system operations (use with caution)"
# Detailed tool description
description: |
  System command execution tool, used to execute shell commands and system operations.

  **Key Features:**
  - Execute arbitrary shell commands
  - Supports shells such as bash and sh
  - You can specify a working directory
  - Returns the command execution result

  **Use Cases:**
  - System administration and maintenance
  - Automated script execution
  - File operations and processing
  - System information gathering

  **Security warning:**
  - ⚠️ This tool can execute arbitrary system commands and poses a security risk
  - ⚠️ Should only be used in a controlled environment
  - ⚠️ All command executions are logged
  - ⚠️ It is recommended to limit the range of executable commands
  - ⚠️ Do not execute untrusted commands
# Parameter definitions
parameters:
  - name: "command"
    type: "string"
    description: |
      The system command to execute. Can be any valid shell command.

      **Format Requirements:**
      - A complete shell command
      - Can include shell features such as pipes and redirection
      - Supports environment variables

      **Example Values:**
      - Simple command: "ls -la"
      - With a pipe: "ps aux | grep nginx"
      - File operation: "cat /etc/passwd"
      - Network command: "curl http://example.com"
      - System information: "uname -a"
      - Find files: "find /var/log -name '*.log'"

      **Notes:**
      - The command executes in the specified shell
      - Ensure the command syntax is correct
      - Pay attention to the security implications of the command
      - Required parameter, cannot be empty
    required: true
    position: 0
    format: "positional"
  - name: "shell"
    type: "string"
    description: |
      The shell type to use, defaults to sh.

      **Possible values:**
      - sh: standard shell (default)
      - bash: Bash Shell
      - zsh: Z Shell
      - Other shells available on the system

      **Example Values:**
      - "sh" (default)
      - "bash"
      - "zsh"

      **Notes:**
      - Ensure the specified shell is available on the system
      - Command syntax may differ slightly between shells
    required: false
    default: "sh"
  - name: "workdir"
    type: "string"
    description: |
      The working directory for command execution. If not specified, the current working directory is used.

      **Format Requirements:**
      - An absolute or relative path
      - The directory must exist

      **Example Values:**
      - "/tmp"
      - "/var/log"
      - "./data"
      - "/home/user/project"

      **Notes:**
      - Ensure the directory exists and is accessible
      - Relative paths are relative to the program's working directory
    required: false
  - name: "additional_args"
    type: "string"
    description: |
      Additional exec parameters. Used to pass exec options not defined in the parameter list.

      **Example Values:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Multiple parameters are separated by spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
