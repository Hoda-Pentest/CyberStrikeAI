name: "gdb"
command: "gdb"
enabled: true
short_description: "GNU调试器，用于二进制分析和调试"
description: |
  GDB是GNU调试器，用于调试和分析二进制程序。

  **Key Features:**
  - Program debugging
  - 内存分析
  - Disassembly
  - 断点设置

  **Use Cases:**
  - Binary analysis
  - Vulnerability research
  - Reverse engineering
  - Program debugging
parameters:
  - name: "binary"
    type: "string"
    description: "Path to the binary file to analyze"
    required: true
    position: 0
    format: "positional"
  - name: "commands"
    type: "string"
    description: "要执行的GDB命令（分号分隔）"
    required: false
    flag: "-ex"
    format: "flag"
  - name: "script_file"
    type: "string"
    description: "GDB脚本文件路径"
    required: false
    flag: "-x"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Additional gdb parameters. Used to pass gdb options not defined in the parameter list.

      **Example Values:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Multiple parameters are separated by spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
