name: "fofa_search"
command: "python3"
args:
  - "-c"
  - |
    import sys
    import json
    import base64
    import requests
    import os

    # ==================== FOFA config ====================
    # configure your FOFA API Key here
    # you can also set it in an environment variable: FOFA_API_KEY
    # enable defaults to false; must be turned on to call this MCP
    FOFA_API_KEY = ""  # fill in your FOFA API key
    # ==================================================

    # FOFA API base URL
    base_url = "https://fofa.info/api/v1/search/all"

    # Parse parameters (from a JSON string or command-line arguments)
    def parse_args():
        # Try to read JSON configuration from the first argument
        if len(sys.argv) > 1:
            try:
                # Ensure sys.argv[1] is a string
                arg1 = str(sys.argv[1])
                # Try to parse as JSON
                config = json.loads(arg1)
                # Ensure the returned value is a dict
                if isinstance(config, dict):
                    return config
            except (json.JSONDecodeError, TypeError, ValueError):
                # If it's not JSON, fall back to the legacy positional-argument style
                pass

        # Legacy positional-argument style (for backward compatibility)
        # note: api_key is not passed as a call parameter, but read from config or environment variable
        # parameter positions: query=2, size=3, page=4, fields=5, full=6
        # but in sys.argv, because of the python3 -c "code" format, the actual position needs adjustment
        # sys.argv[0] is '-c', the actual parameters start at sys.argv[1]
        config = {}
        if len(sys.argv) > 1:
            config['query'] = str(sys.argv[1])
        if len(sys.argv) > 2:
            try:
                config['size'] = int(sys.argv[2])
            except (ValueError, TypeError):
                pass
        if len(sys.argv) > 3:
            try:
                config['page'] = int(sys.argv[3])
            except (ValueError, TypeError):
                pass
        if len(sys.argv) > 4:
            config['fields'] = str(sys.argv[4])
        if len(sys.argv) > 5:
            val = sys.argv[5]
            if isinstance(val, str):
                config['full'] = val.lower() in ('true', '1', 'yes')
            else:
                config['full'] = bool(val)
        return config

    try:
        config = parse_args()

        # Ensure config is a dict
        if not isinstance(config, dict):
            error_result = {
                "status": "error",
                "message": f"Parameter parsing error: expected a dict, got {type(config).__name__}",
                "type": "TypeError"
            }
            print(json.dumps(error_result, ensure_ascii=False, indent=2))
            sys.exit(1)

        # get api_key from config or environment variable
        api_key = os.getenv('FOFA_API_KEY', FOFA_API_KEY).strip()
        query = config.get('query', '').strip()

        if not api_key:
            error_result = {
                "status": "error",
                "message": "Missing FOFA config: api_key (FOFA API key)",
                "required_config": ["api_key"],
                "note": "Fill in your API key in the FOFA_API_KEY config item in the YAML file, or set it in the FOFA_API_KEY environment variable. The API key can be obtained from the FOFA user center: https://fofa.info/userInfo"
            }
            print(json.dumps(error_result, ensure_ascii=False, indent=2))
            sys.exit(1)

        if not query:
            error_result = {
                "status": "error",
                "message": "Missing required parameter: query (search query string)",
                "required_params": ["query"],
                "examples": [
                    'app="Apache"',
                    'title="login"',
                    'domain="example.com"',
                    'ip="1.1.1.1"',
                    'port="80"',
                    'country="CN"',
                    'city="Beijing"'
                ]
            }
            print(json.dumps(error_result, ensure_ascii=False, indent=2))
            sys.exit(1)

        # build request parameters
        params = {
            'key': api_key,
            'qbase64': base64.b64encode(query.encode('utf-8')).decode('utf-8')
        }

        # Optional parameters
        if 'size' in config and config['size'] is not None:
            try:
                size = int(config['size'])
                if size > 0:
                    params['size'] = size
            except (ValueError, TypeError):
                pass

        if 'page' in config and config['page'] is not None:
            try:
                page = int(config['page'])
                if page > 0:
                    params['page'] = page
            except (ValueError, TypeError):
                pass

        if 'fields' in config and config['fields']:
            params['fields'] = str(config['fields']).strip()

        if 'full' in config and config['full'] is not None:
            full_val = config['full']
            if isinstance(full_val, bool):
                params['full'] = 'true' if full_val else 'false'
            elif isinstance(full_val, str):
                params['full'] = 'true' if full_val.lower() in ('true', '1', 'yes') else 'false'
            elif isinstance(full_val, (int, float)):
                params['full'] = 'true' if full_val != 0 else 'false'

        # send request
        try:
            response = requests.get(base_url, params=params, timeout=30)
            response.raise_for_status()

            result_data = response.json()

            # check errors returned by the FOFA API
            if result_data.get('error'):
                error_result = {
                    "status": "error",
                    "message": f"FOFA API error: {result_data.get('errmsg', 'unknown error')}",
                    "error_code": result_data.get('error'),
                    "suggestion": "Please check whether the API key is correct, or whether the query statement conforms to FOFA syntax"
                }
                print(json.dumps(error_result, ensure_ascii=False, indent=2))
                sys.exit(1)

            # Format the output result
            output = {
                "status": "success",
                "query": query,
                "size": result_data.get('size', 0),
                "page": result_data.get('page', 1),
                "total": result_data.get('total', 0),
                "results_count": len(result_data.get('results', [])),
                "results": result_data.get('results', []),
                "message": f"Successfully retrieved {len(result_data.get('results', []))} results"
            }

            print(json.dumps(output, ensure_ascii=False, indent=2))

        except requests.exceptions.RequestException as e:
            error_result = {
                "status": "error",
                "message": f"Request failed: {str(e)}",
                "suggestion": "Please check the network connection or FOFA API service status"
            }
            print(json.dumps(error_result, ensure_ascii=False, indent=2))
            sys.exit(1)

    except Exception as e:
        error_result = {
            "status": "error",
            "message": f"Execution error: {str(e)}",
            "type": type(e).__name__
        }
        print(json.dumps(error_result, ensure_ascii=False, indent=2))
        sys.exit(1)
enabled: false
short_description: "FOFA cyberspace search engine, supports flexible query parameter configuration"
description: |
  FOFA is a cyberspace mapping search engine that can search internet assets using various query conditions.

  **Key Features:**
  - Supports multiple query syntaxes (app, title, domain, ip, port, country, city, etc.)
  - Flexible return-field configuration
  - Pagination query support
  - Full data mode (the full parameter)

  **Use Cases:**
  - Asset discovery and enumeration
  - Vulnerability impact assessment
  - Security posture awareness
  - Threat intelligence gathering
  - Bug bounty reconnaissance

  **Query Syntax:**

  **Basic query:**
  - Enter a query statement directly; it will search in the title, HTML content, HTTP header information, and URL fields
  - If the query expression has multiple AND/OR relationships, try to wrap them in parentheses, e.g.: `(app="Apache" || app="Nginx") && country="CN"`

  **Logical connectors:**
  - `=` - match; when ="", can query cases where the field does not exist or the value is empty
  - `==` - exact match; when =="", can query cases where the field exists and the value is empty
  - `&&` - and (AND)
  - `||` - or (OR)
  - `!=` - does not match; when !="", can query cases where the value is not empty
  - `*=` - fuzzy match, uses * or ? to search
  - `()` - determine query priority; content in parentheses has the highest priority

  **Common query syntax categories:**

  **Basic fields:** `ip` (supports IPv4/IPv6/CIDR), `port`, `domain`, `host`, `os`, `server`, `asn`, `org`, `is_domain`, `is_ipv6`

  **Tag fields:** `app` (application identification), `fid` (site fingerprint), `product`, `product.version`, `category`, `type` (service/subdomain), `cloud_name`, `is_cloud`, `is_fraud`, `is_honeypot`

  **Protocol fields (type=service):** `protocol`, `banner`, `banner_hash`, `banner_fid`, `base_protocol` (tcp/udp)

  **Website fields (type=subdomain):** `title`, `header`, `header_hash`, `body`, `body_hash`, `js_name`, `js_md5`, `cname`, `cname_domain`, `icon_hash`, `status_code`, `icp`, `sdk_hash`

  **Geolocation:** `country` (supports code/Chinese), `region` (supports English/Chinese, Chinese limited to China only), `city`

  **Certificate fields:** `cert`, `cert.subject`, `cert.issuer`, `cert.subject.org`, `cert.subject.cn`, `cert.issuer.org`, `cert.issuer.cn`, `cert.domain`, `cert.is_equal`, `cert.is_valid`, `cert.is_match`, `cert.is_expired`, `jarm`, `tls.version`, `tls.ja3s`, `cert.sn`, `cert.not_after.after/before`, `cert.not_before.after/before`

  **Time fields:** `after` (updated after a given time), `before` (updated before a given time)

  **Standalone IP syntax (cannot be combined with other syntax):** `port_size`, `port_size_gt`, `port_size_lt`, `ip_ports`, `ip_country`, `ip_region`, `ip_city`, `ip_after`, `ip_before`

  **Common query examples:**
  - `app="Apache"` - search for Apache applications
  - `title="login"` - search for pages whose title contains "login"
  - `domain="example.com"` - search for a specific domain
  - `ip="1.1.1.1"` or `ip="220.181.111.1/24"` - search by IP or CIDR range
  - `port="80"` - search for assets with port 80 open
  - `country="CN"` or `country="中国"` - search for assets within China
  - `city="Beijing"` - search for assets in Beijing
  - `app="Apache" && country="CN"` - combined query
  - `(app="Apache" || app="Nginx") && country="CN"` - complex query using parentheses
  - `title*="login"` - fuzzy match on the title
  - `after="2023-01-01" && before="2023-12-01"` - time-range query

  **Detailed syntax documentation:** For more syntax notes and the component list, refer to the official FOFA documentation


  **Notes:**
  - The API has rate limits, please use it reasonably
  - The number of query results is limited by account permissions
  - the full parameter requires advanced privileges
parameters:
  - name: "query"
    type: "string"
    description: |
      FOFA query statement (required)

      Search query statement, supports FOFA query syntax.
      Example:
      - app="Apache"
      - title="login"
      - domain="example.com"
      - ip="1.1.1.1"
      - port="80"
      - country="CN"
      - app="Apache" && country="CN"
    required: true
    position: 2
    format: "positional"
  - name: "size"
    type: "int"
    description: |
      Number of returned results (optional)

      Number of results returned per page, default 100.
      Range: 1-10000, limited by account permissions.
    required: false
    position: 3
    format: "positional"
    default: 100
  - name: "page"
    type: "int"
    description: |
      Page number (optional)

      The page number to return, starting from 1, default 1.
      Used to paginate large result sets.
    required: false
    position: 4
    format: "positional"
    default: 1
  - name: "fields"
    type: "string"
    description: |
      List of fields to return (optional)

      The fields to return, multiple fields separated by commas.
      Default fields: ip,port,domain
      Available fields: host,title,ip,domain,port,protocol,country,region,city,server,icp,header,banner,body,asn,org
    required: false
    position: 5
    format: "positional"
    default: "ip,port,domain"
  - name: "full"
    type: "bool"
    description: |
      Whether to return full data (optional)

      When set to true, full data is returned; this requires advanced privileges.
      Defaults to false, returns basic data.
    required: false
    position: 6
    format: "positional"
    default: false
