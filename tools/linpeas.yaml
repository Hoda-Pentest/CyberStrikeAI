name: "linpeas"
command: "linpeas.sh"
enabled: true
short_description: "Linux 权限提升枚举脚本，自动检测常见提权路径"
description: |
  LinPEAS (Linux Privilege Escalation Awesome Script) 是一个自动化权限提升枚举脚本，用于检测 Linux 系统中的常见提权路径。

  **Key Features:**
  - System information gathering
  - 权限和组检查
  - 可写文件和目录检测
  - SUID/SGID 文件查找
  - 环境变量检查
  - 定时任务分析
  - 网络配置检查
  - 敏感文件查找

  **Use Cases:**
  - Penetration testing中的权限提升
  - Security audit
  - Post-exploitation testing
  - CTF 竞赛

  **Notes:**
  - 需要目标系统上已下载 linpeas.sh 脚本
  - 执行时间可能较长
  - 输出信息量大，建议保存到文件
parameters:
  - name: "output"
    type: "string"
    description: "Output file path（可选）"
    required: false
    flag: "-o"
    format: "flag"
  - name: "fast"
    type: "bool"
    description: "快速模式，跳过耗时检查"
    required: false
    flag: "-fast"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Additional linpeas parameters. Used to pass linpeas options not defined in the parameter list.

      **Example Values:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Multiple parameters are separated by spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
