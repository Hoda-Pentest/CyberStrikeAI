name: "xxd"
command: "xxd"
enabled: true
short_description: "十六进制转储工具"
description: |
  Xxd是一个十六进制转储工具，用于以十六进制格式显示文件内容。

  **Key Features:**
  - 十六进制转储
  - 可配置偏移和长度
  - 反向转换
  - Multiple output formats

  **Use Cases:**
  - Binary analysis
  - 文件检查
  - Data extraction
  - Forensic analysis
parameters:
  - name: "file_path"
    type: "string"
    description: "要转储的文件路径"
    required: true
    position: 0
    format: "positional"
  - name: "offset"
    type: "string"
    description: "开始读取的偏移量"
    required: false
    flag: "-s"
    format: "flag"
    default: "0"
  - name: "length"
    type: "string"
    description: "要读取的字节数"
    required: false
    flag: "-l"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Additional xxd parameters. Used to pass xxd options not defined in the parameter list.

      **Example Values:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Multiple parameters are separated by spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
