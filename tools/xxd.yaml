name: "xxd"
command: "xxd"
enabled: true
short_description: "hex dump tool"
description: |
  Xxd is a hex dump tool used to display file content in hexadecimal format.

  **Key Features:**
  - Hex dump
  - Configurable offset and length
  - Reverse conversion
  - Multiple output formats

  **Use Cases:**
  - Binary analysis
  - File inspection
  - Data extraction
  - Forensic analysis
parameters:
  - name: "file_path"
    type: "string"
    description: "path of the file to dump"
    required: true
    position: 0
    format: "positional"
  - name: "offset"
    type: "string"
    description: "offset to start reading from"
    required: false
    flag: "-s"
    format: "flag"
    default: "0"
  - name: "length"
    type: "string"
    description: "number of bytes to read"
    required: false
    flag: "-l"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Additional xxd parameters. Used to pass xxd options not defined in the parameter list.

      **Example Values:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Multiple parameters are separated by spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
