name: "binwalk"
command: "binwalk"
enabled: true
short_description: "固件和文件分析工具"
description: |
  Binwalk是一个固件分析工具，用于分析、提取和逆向工程固件镜像。

  **Key Features:**
  - 文件签名识别
  - File extraction
  - 熵分析
  - Firmware analysis

  **Use Cases:**
  - Firmware analysis
  - 文件格式识别
  - Data extraction
  - Reverse engineering
parameters:
  - name: "file_path"
    type: "string"
    description: "Path to the file to analyze"
    required: true
    position: 0
    format: "positional"
  - name: "extract"
    type: "bool"
    description: "提取发现的文件"
    required: false
    flag: "-e"
    format: "flag"
    default: false
  - name: "additional_args"
    type: "string"
    description: |
      Additional binwalk parameters. Used to pass binwalk options not defined in the parameter list.

      **Example Values:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Multiple parameters are separated by spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
