name: "paramspider"
command: "paramspider"
enabled: true
short_description: "从Web档案中挖掘参数"
description: |
  ParamSpider从Web档案中挖掘参数，用于发现隐藏的参数。

  **Key Features:**
  - 参数挖掘
  - Web档案查询
  - 多级深度支持
  - Extension filtering

  **Use Cases:**
  - Parameter discovery
  - Bug bounty reconnaissance
  - Web application security testing
  - Security testing
parameters:
  - name: "domain"
    type: "string"
    description: "Target domain"
    required: true
    flag: "-d"
    format: "flag"
  - name: "level"
    type: "int"
    description: "挖掘深度级别"
    required: false
    flag: "-l"
    format: "flag"
    default: 2
  - name: "exclude"
    type: "string"
    description: "要排除的文件扩展名"
    required: false
    flag: "-e"
    format: "flag"
  - name: "output"
    type: "string"
    description: "Output file path"
    required: false
    flag: "-o"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Additional paramspider parameters. Used to pass paramspider options not defined in the parameter list.

      **Example Values:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Multiple parameters are separated by spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
