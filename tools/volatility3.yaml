name: "volatility3"
command: "volatility3"
enabled: true
short_description: "Volatility3内存取证分析工具"
description: |
  Volatility3是Volatility框架的下一代版本，用于内存取证分析。

  **Key Features:**
  - 内存转储分析
  - 高级插件系统
  - 改进的性能
  - 更好的文档

  **Use Cases:**
  - 内存取证
  - Malware analysis
  - 事件响应
  - Digital forensics
parameters:
  - name: "memory_file"
    type: "string"
    description: "内存转储文件路径"
    required: true
    flag: "-f"
    format: "flag"
  - name: "plugin"
    type: "string"
    description: "要执行的Volatility3插件"
    required: true
    position: 0
    format: "positional"
  - name: "output_file"
    type: "string"
    description: "Output file path"
    required: false
    flag: "-o"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Additional volatility3 parameters. Used to pass volatility3 options not defined in the parameter list.

      **Example Values:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Multiple parameters are separated by spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
