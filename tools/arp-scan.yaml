name: "arp-scan"
command: "arp-scan"
enabled: true
short_description: "ARP网络发现工具"
description: |
  Arp-scan是一个ARP网络发现工具，用于发现本地网络中的活动主机。

  **Key Features:**
  - ARP扫描
  - Local network discovery
  - MAC地址识别
  - Quick scan

  **Use Cases:**
  - Local network discovery
  - 主机发现
  - Network mapping
  - Penetration testing
parameters:
  - name: "target"
    type: "string"
    description: "目标IP范围（如果不使用local_network）"
    required: false
    position: 0
    format: "positional"
  - name: "interface"
    type: "string"
    description: "Network interface"
    required: false
    flag: "-I"
    format: "flag"
  - name: "local_network"
    type: "bool"
    description: "扫描本地网络"
    required: false
    flag: "-l"
    format: "flag"
    default: false
  - name: "additional_args"
    type: "string"
    description: |
      Additional arp-scan parameters. Used to pass arp-scan options not defined in the parameter list.

      **Example Values:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Multiple parameters are separated by spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
