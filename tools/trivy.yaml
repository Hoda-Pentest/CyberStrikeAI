name: "trivy"
command: "trivy"
enabled: true
short_description: "容器和文件系统漏洞扫描器"
description: |
  Trivy是一个简单而全面的容器和文件系统漏洞扫描器。

  **Key Features:**
  - Container image scanning
  - 文件系统扫描
  - 代码仓库扫描
  - 配置文件扫描

  **Use Cases:**
  - Container security scanning
  - CI/CD integration
  - Vulnerability detection
  - Security audit
parameters:
  - name: "scan_type"
    type: "string"
    description: "扫描类型（image, fs, repo, config）"
    required: false
    default: "image"
    position: 0
    format: "positional"
  - name: "target"
    type: "string"
    description: "扫描目标（镜像名、目录、仓库）"
    required: true
    position: 1
    format: "positional"
  - name: "severity"
    type: "string"
    description: "严重程度过滤（UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL）"
    required: false
    flag: "--severity"
    format: "flag"
  - name: "output_format"
    type: "string"
    description: "输出格式（json, table, sarif）"
    required: false
    flag: "--format"
    format: "flag"
    default: "json"
  - name: "additional_args"
    type: "string"
    description: |
      Additional Trivy parameters. Used to pass Trivy options not defined in the parameter list.

      **Example Values:**
      - "--exit-code 1": 发现漏洞时退出码为1
      - "--skip-dirs": 跳过目录
      - "--skip-files": 跳过文件
      - "--no-progress": 不显示进度条

      **Notes:**
      - Multiple parameters are separated by spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
