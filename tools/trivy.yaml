name: "trivy"
command: "trivy"
enabled: true
short_description: "container and filesystem vulnerability scanner"
description: |
  Trivy is a simple and comprehensive container and filesystem vulnerability scanner.

  **Key Features:**
  - Container image scanning
  - File system scanning
  - Code repository scanning
  - Configuration file scanning

  **Use Cases:**
  - Container security scanning
  - CI/CD integration
  - Vulnerability detection
  - Security audit
parameters:
  - name: "scan_type"
    type: "string"
    description: "scan type (image, fs, repo, config)"
    required: false
    default: "image"
    position: 0
    format: "positional"
  - name: "target"
    type: "string"
    description: "scan target (image name, directory, repository)"
    required: true
    position: 1
    format: "positional"
  - name: "severity"
    type: "string"
    description: "severity filter (UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL)"
    required: false
    flag: "--severity"
    format: "flag"
  - name: "output_format"
    type: "string"
    description: "output format (json, table, sarif)"
    required: false
    flag: "--format"
    format: "flag"
    default: "json"
  - name: "additional_args"
    type: "string"
    description: |
      Additional Trivy parameters. Used to pass Trivy options not defined in the parameter list.

      **Example Values:**
      - "--exit-code 1": exit code is 1 when a vulnerability is found
      - "--skip-dirs": skip directories
      - "--skip-files": skip files
      - "--no-progress": do not show the progress bar

      **Notes:**
      - Multiple parameters are separated by spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
