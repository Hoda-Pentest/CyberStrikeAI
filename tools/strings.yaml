name: "strings"
command: "strings"
enabled: true
short_description: "extract strings from binary files"
description: |
  The Strings tool is used to extract printable strings from binary files.

  **Key Features:**
  - String extraction
  - Configurable minimum length
  - Supports multiple file formats

  **Use Cases:**
  - Binary analysis
  - Malware analysis
  - Forensic analysis
  - Reverse engineering
parameters:
  - name: "file_path"
    type: "string"
    description: "Path to the file to analyze"
    required: true
    position: 0
    format: "positional"
  - name: "min_len"
    type: "int"
    description: "minimum string length"
    required: false
    flag: "-n"
    format: "flag"
    default: 4
  - name: "additional_args"
    type: "string"
    description: |
      Additional strings parameters. Used to pass strings options not defined in the parameter list.

      **Example Values:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Multiple parameters are separated by spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
