name: "strings"
command: "strings"
enabled: true
short_description: "从二进制文件中提取字符串"
description: |
  Strings工具用于从二进制文件中提取可打印字符串。

  **Key Features:**
  - 字符串提取
  - 可配置最小长度
  - 支持多种文件格式

  **Use Cases:**
  - Binary analysis
  - Malware analysis
  - Forensic analysis
  - Reverse engineering
parameters:
  - name: "file_path"
    type: "string"
    description: "Path to the file to analyze"
    required: true
    position: 0
    format: "positional"
  - name: "min_len"
    type: "int"
    description: "最小字符串长度"
    required: false
    flag: "-n"
    format: "flag"
    default: 4
  - name: "additional_args"
    type: "string"
    description: |
      Additional strings parameters. Used to pass strings options not defined in the parameter list.

      **Example Values:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Multiple parameters are separated by spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
