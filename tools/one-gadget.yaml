name: "one-gadget"
command: "one_gadget"
enabled: true
short_description: "在libc中查找one-shot RCE gadget的工具"
description: |
  One-gadget是一个用于在libc中查找one-shot RCE gadget的工具。

  **Key Features:**
  - One-shot gadget搜索
  - 约束级别检查
  - 多种libc支持

  **Use Cases:**
  - CTF challenges
  - Exploit development
  - ROP链简化
  - Security research
parameters:
  - name: "libc_path"
    type: "string"
    description: "libc二进制文件路径"
    required: true
    position: 0
    format: "positional"
  - name: "level"
    type: "int"
    description: "约束级别（0, 1, 2）"
    required: false
    flag: "-l"
    format: "flag"
    default: 1
  - name: "additional_args"
    type: "string"
    description: |
      Additional one-gadget parameters. Used to pass one-gadget options not defined in the parameter list.

      **Example Values:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Multiple parameters are separated by spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
