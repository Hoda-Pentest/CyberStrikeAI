name: "one-gadget"
command: "one_gadget"
enabled: true
short_description: "tool for finding one-shot RCE gadgets in libc"
description: |
  One-gadget is a tool for finding one-shot RCE gadgets in libc.

  **Key Features:**
  - One-shot gadget search
  - Constraint level checking
  - Support for multiple libc versions

  **Use Cases:**
  - CTF challenges
  - Exploit development
  - ROP chain simplification
  - Security research
parameters:
  - name: "libc_path"
    type: "string"
    description: "libc binary file path"
    required: true
    position: 0
    format: "positional"
  - name: "level"
    type: "int"
    description: "constraint level (0, 1, 2)"
    required: false
    flag: "-l"
    format: "flag"
    default: 1
  - name: "additional_args"
    type: "string"
    description: |
      Additional one-gadget parameters. Used to pass one-gadget options not defined in the parameter list.

      **Example Values:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Multiple parameters are separated by spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
