name: "clair"
command: "clair"
enabled: false
short_description: "container vulnerability analysis tool"
description: |
  Clair is a container vulnerability analysis tool used to scan container images for vulnerabilities.

  **Key Features:**
  - Container image scanning
  - Vulnerability detection
  - Support for multiple databases
  - API interface

  **Use Cases:**
  - Container security scanning
  - Vulnerability detection
  - CI/CD integration
  - Security audit
parameters:
  - name: "image"
    type: "string"
    description: "container image to scan"
    required: true
    flag: "--image"
    format: "flag"
  - name: "config"
    type: "string"
    description: "Clair config file"
    required: false
    flag: "--config"
    format: "flag"
    default: "/etc/clair/config.yaml"
  - name: "output_format"
    type: "string"
    description: "Output format (json, yaml)"
    required: false
    flag: "--format"
    format: "flag"
    default: "json"
  - name: "additional_args"
    type: "string"
    description: |
      Additional clair parameters. Used to pass clair options not defined in the parameter list.

      **Example Values:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Multiple parameters are separated by spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
