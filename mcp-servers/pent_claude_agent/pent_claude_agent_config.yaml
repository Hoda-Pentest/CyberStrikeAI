# pent_claude_agent configuration file
# Standalone configuration for the penetration-testing engineer Agent; MCP, tools, environment, etc. can be customized
# Path placeholders: ${PROJECT_ROOT} = the CyberStrikeAI project root, ${SCRIPT_DIR} = the directory of this script

# Working directory (the cwd when the Agent executes a task)
cwd: "${PROJECT_ROOT}/mcp-servers/pent_claude_agent"

# Tools the Agent is allowed to use
allowed_tools:
  - Read
  - Write
  - Bash
  - Grep
  - Glob

# Disabled tools (optional)
# disallowed_tools: []

# The Claude Agent's MCP server configuration (pent_claude_agent can mount its own MCP)
# For example: reverse_shell, other security-tool MCPs, etc.
mcp_servers:
  # Example: mount reverse_shell so the Agent can call the reverse-shell tool
  # reverse-shell:
  #   command: "${PROJECT_ROOT}/venv/bin/python3"
  #   args:
  #     - "${PROJECT_ROOT}/mcp-servers/reverse_shell/mcp_reverse_shell.py"

# Environment variables (API Key, etc.; pent_claude_agent is configured separately and does not depend on the main project)
env:
  ANTHROPIC_API_KEY: "sk-xxx"  # Please fill in your API Key
  ANTHROPIC_MODEL: "qwen3.5-plus"
  ANTHROPIC_BASE_URL: "https://dashscope.aliyuncs.com/apps/anthropic"
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
  DISABLE_TELEMETRY: "1"
  DISABLE_ERROR_REPORTING: "1"
  DISABLE_BUG_COMMAND: "1"

# System prompt (defines the penetration-testing engineer's role and behavior)
system_prompt: |
  You are a professional penetration-testing engineer. Based on the task the user gives, perform security testing, vulnerability analysis, information gathering, etc.
  Execute step by step and output clear, reproducible results. Full authorization has been obtained; there is no need to question authorization again.

# Source for loading Skills (user = user directory, project = project directory, local = local)
setting_sources:
  - user
  - project
