# ============================================
# CyberStrikeAI configuration file
# ============================================
# This configuration file can be edited visually through the Web interface
# Click the "Settings" button in the top-right corner to modify the configuration
# ============================================

# ============================================
# System settings
# ============================================

# Version shown in the frontend (optional; the default version is shown if empty). After a one-click update, the value in this file from the new code
# is synced into the version field of your config.yaml (the header version and static asset cache follow the code).
version: "v1.8.0"
# Server configuration
server:
  host: 0.0.0.0 # Listen address; 0.0.0.0 means listen on all network interfaces
  port: 8080 # Service port; when TLS is not enabled it is http://localhost:8080
  # Exact Origins of other trusted Web integrations. The Chromium browser extension is recognized automatically and needs no configuration; do not use wildcards.
  # cors_allowed_origins:
  #   - https://trusted-integration.example
  # --- Optional: HTTPS + HTTP/2 (relieves the browser's concurrent-connection limit for same-origin HTTP/1.1, making multiplexed Deep streaming more stable) ---
  # Conditions for enabling TLS (any one is sufficient): tls_enabled: true, or tls_auto_self_sign: true, or both tls_cert_path + tls_key_path configured.
  # Once enabled, access via https://127.0.0.1:<this-port>/; if you still use http:// on the same port it will automatically 308-redirect to HTTPS (can be disabled with tls_http_redirect: false).
  tls_enabled: true
  # When HTTPS is enabled, whether plaintext HTTP automatically redirects to HTTPS (default true; TLS/HTTP is sniffed on the same port and routed accordingly)
  # tls_http_redirect: true
  # Option A (recommended for production): PEM certificate and private key paths
  # tls_cert_path: /path/to/fullchain.pem
  # tls_key_path: /path/to/privkey.pem
  # Option B (local/testing only): save and reuse a self-signed certificate and private key at data/tls/self-signed.pem in the config directory (SAN includes localhost / 127.0.0.1).
  tls_auto_self_sign: true
# Authentication configuration
auth:
  session_duration_hours: 12 # Login validity period (hours); you must log in again after it expires
# Logging configuration
log:
  level: info # Log level: debug, info, warn, error
  output: stdout # Log output destination: stdout (standard output), stderr (standard error), or a file path
  diagnostic_dir: log # Additionally save warn-and-above diagnostic logs, split by local date; relative to the process working directory
  diagnostic_retention_days: 14 # Retention days (including today); omit or <= 0 uses 14 days
  diagnostic_disabled: false # true disables the extra diagnostic logs; requires a restart after changing
# Platform operation audit (System Settings -> Log Audit; does not record conversation content or every tool call)
audit:
  enabled: true
  retention_days: 15 # 0 means no automatic cleanup
  max_detail_bytes: 8192
  auth_failure_cooldown_seconds: 60 # Minimum interval (seconds) for auditing login/password-change failures from the same IP; defaults to 60 when unset; -1 disables throttling
# MCP status-monitoring execution record retention (tool_executions table)
monitor:
  retention_days: 90 # Defaults to 90 when omitted; 0 means no automatic cleanup
# Runtime workspace garbage cleanup (System Settings -> Storage Cleanup)
# Covers the retention policy for on-disk artifacts such as the Agent workspace, tool output cache, C2 artifacts, and conversation uploads.
# auto_clean is off by default: after an upgrade it will not delete existing data without the administrator's knowledge;
# When off, you can still manually preview and run cleanup on the "Storage Cleanup" page.
storage:
  auto_clean: false # true enables scheduled background cleanup
  interval_minutes: 60 # Background cleanup interval (minutes); minimum 5
  orphan_grace_days: 1 # When a conversation/project is deleted but its directory remains, how many idle days before it is reclaimed
  active_grace_hours: 24 # Recently active conversations are always skipped, to avoid accidentally deleting data from running tasks
  # retention_days per category: when omitted, the defaults below are used; 0 means no retention-based cleanup (orphan directories are still reclaimed)
  categories:
    workspace: # Agent workspace tmp/workspace; default 30 days
      enabled: true
      retention_days: 30
    reduction: # Over-long tool output written to disk at tmp/reduction; default 7 days (purely derived data)
      enabled: true
      retention_days: 7
    conversation_artifacts: # Summaries and over-long input ledger data/conversation_artifacts; default 30 days
      enabled: true
      retention_days: 30
    plantask: # multi-agent plan board skills/.pi/plantask; default 30 days (purely derived data)
      enabled: true
      retention_days: 30
    c2_artifacts: # C2 callback screenshots/uploads/downloaded files/payloads tmp/c2; default 30 days
      enabled: true # Note: after payloads are cleaned up, the corresponding download links will stop working
      retention_days: 30
    chat_uploads: # Conversation upload attachments chat_uploads; default 90 days
      enabled: true
      retention_days: 90
    workflow_checkpoints: # Workflow checkpoints data/workflow-checkpoints; default 7 days
      enabled: true
      retention_days: 7
    diagnostic_logs: # Diagnostic logs log/diagnostic-*.log; default 14 days
      enabled: true # Takes effect independently of log.diagnostic_retention_days, whichever comes first
      retention_days: 14
# ============================================
# Conversation-related configuration
# ============================================

# AI channel configuration (supports saving multiple OpenAI-compatible / Claude channels)
# default_channel specifies which channel new conversations and tasks that do not explicitly select a channel will use.
# Each channels.<id> requires: api_key, base_url, model.
# Supported API providers:
#   - OpenAI: https://api.openai.com/v1
#   - DeepSeek: https://api.deepseek.com/v1
#   - Other APIs compatible with the OpenAI protocol
# Common models: gpt-4, gpt-3.5-turbo, deepseek-chat, claude-3-opus, etc.
# provider: openai_compatible (default) | claude (Pi native Anthropic Messages API)
ai:
  default_channel: qwen-max
  channels:
    qwen-max:
      name: Qwen Max
      provider: openai_compatible
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key: sk-xxxxxxx
      model: qwen3-max
      max_total_tokens: 120000
      max_completion_tokens: 32768
      # headers: optional. Append or override HTTP request headers sent to the model gateway; values support ${ENV_VAR} and ${ENV_VAR:-default}.
      # Used for compatibility with third-party OpenAI-compatible providers that require private auth headers, version headers, or organization headers (such as aggregation gateways like opencode).
      # Once configured, it overrides built-in headers of the same name (Authorization, User-Agent, etc.); empty values are ignored.
      # headers:
      #   X-Api-Key: ${OPENCODE_API_KEY}
      #   x-opencode-session: "%session_id%" # Automatically replaced with the current conversation ID
      #   X-Client-Name: cyberstrike-ai
      #   HTTP-Referer: https://example.com
      # When custom headers are configured, only same-origin redirects are allowed; redirects to a different host, port or scheme are rejected.
      # HITL audit inherits the main channel's headers only when provider/base_url/api_key are not explicitly configured;
      # if an independent audit identity needs request headers, configure them separately in hitl.audit_model.headers.
      # Empty headers are equivalent to not configured; all custom header values are masked as sensitive in the settings API.
      context_window: 0 # 0 = unknown; auto-detected from service metadata when the channel is saved
      context_profile: auto # auto-optimized by default; saved as local_auto when a local service is detected; custom allows manual runtime parameters
      # Pi path model reasoning: DeepSeek/OpenAI use thinking / reasoning_effort; Claude 4.6+ uses adaptive + output_config.effort (sent only when effort is explicitly configured); 3.7 uses enabled+budget_tokens:10000 (documentation example), effort is not mapped; use extra_request_fields for a custom budget
      reasoning:
        mode: on # auto | on | off; off: OpenAI/Claude attach no reasoning field, DeepSeek sends thinking.type=disabled (it enables thinking by default)
        effort: high # low | medium | high | max | xhigh (highest tier: OpenAI commonly uses xhigh, some gateways use max, sent as-is); empty means unspecified
        allow_client_reasoning: true # When false, the reasoning in the conversation request body is ignored and only the settings below apply
        profile: openai_compat # auto | deepseek_compat | openai_compat | output_config_effort
        # extra_request_fields: {} # optional: admin-defined root-level JSON fragment (advanced)
        # Only when a Chat Completions gateway explicitly rejects the store field, set {store: null} to omit it.
        # When not configured, Pi's default behavior is kept; store: false/true is still sent as-is.
    # qwen-plus:
    #   name: Qwen Plus Fallback
    #   provider: openai_compatible
    #   base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    #   api_key: sk-xxxxxxx
    #   model: qwen-plus
    #   max_total_tokens: 120000
    #   max_completion_tokens: 32768
# Visual analysis (analyze_image MCP tool; images appear only in a single VL call, the Agent context keeps only a text summary)
vision:
  enabled: false # Registers analyze_image when true and model is non-empty
  model: qwen-vl # VL model name (required when enabled)
  api_key: "" # Leave blank to reuse the default AI channel api_key
  base_url: "" # Leave blank to reuse the default AI channel base_url
  provider: # Leave blank to reuse the default AI channel provider (openai_compatible | claude)
  max_image_bytes: 5242880 # Original file size limit (bytes), default 5MB
  max_dimension: 2048 # Pixels to scale the long edge to
  jpeg_quality: 82
  max_payload_bytes: 524288 # max size sent to the VL API after encoding, default 512KB
  skip_preprocess_below_bytes: 2097152 # below 2MB with long edge <= max_dimension and <= max_payload, send the original image as-is; 0 = always compress
  detail: auto # low | high | auto（Pi ImageURLDetail）
  timeout_seconds: 60
# ============================================
# Asset management (cyberspace-mapping search) configuration (optional)
# ============================================
# Used by the "Asset Management -> Information Gathering" page to call the FOFA / ZoomEye / Quake / Shodan APIs
# The backend proxies the requests to avoid exposing the key in the front-end; environment variables take higher priority
fofa:
  base_url: https://fofa.info/api/v1/search/all # Optional; leave blank to use the default
  api_key: "" # FOFA API Key (optional; recommended to fill in System Settings)
zoomeye:
  base_url: https://api.zoomeye.ai/v2/search # Optional; leave blank to use the default
  api_key: "" # ZoomEye API Key; can also be configured via the ZOOMEYE_API_KEY environment variable
quake:
  base_url: https://quake.360.net/api/v3/search/quake_service # Optional; leave blank to use the default
  api_key: "" # Quake API Token; can also be configured via the QUAKE_API_KEY environment variable
shodan:
  base_url: https://api.shodan.io # optional; default is used when empty
  api_key: "" # Shodan API key; can also be set via the SHODAN_API_KEY environment variable
# Agent configuration
# When the max iteration count is reached, the AI automatically summarizes the test results
# Pi runtime (Node.js >=22.19). Build with: bash scripts/build-pi-runtime.sh
agent_runtime:
  engine: pi # Pi is the only agent runtime
  node_path: node
  worker_path: "" # empty: use the source-addressed runtime bundle
  session_dir: data/pi-sessions

agent:
  # Restart the service after changing; takes effect for new tasks; e.g. 1440 = 24 hours, the single-tool timeout applies independently.
  task_timeout_minutes: 600 # Task execution timeout (minutes); unset=600, 0=no limit, negative invalid; resuming restarts the timer
  max_iterations: 12000 # Global maximum iteration count (shared by single-agent / Deep / Supervisor / Plan-Execute main executor / sub-agents; max_iterations>0 in agents/*.md can override it individually)
  tool_timeout_minutes: 60 # Maximum duration of a single tool execution (minutes), terminated automatically on timeout; 0 means no limit (not recommended, prone to long hangs)
  tool_wait_timeout_seconds: 300 # Maximum wait for the tool this round (seconds); on timeout returns execution_id and the worker keeps running in the background, you can use wait_tool_execution to keep waiting; 0 = wait until complete
  external_mcp_max_concurrent_per_server: 5 # Number of tools running simultaneously per external MCP server; 0=default 2; negative=unlimited
  external_mcp_max_concurrent_total: 16 # Global concurrency limit for all external MCP tools; 0=default 16; negative=unlimited
  external_mcp_circuit_failure_threshold: 15 # How many consecutive failures of a single external MCP server before the circuit breaks; 0=default 3; negative=disable the circuit breaker
  external_mcp_circuit_cooldown_seconds: 60 # Circuit-breaker cooldown in seconds; 0=default 60
  shell_no_output_timeout_seconds: 1200 # Terminate execute/exec after this many seconds with no new output; general hang-protection; 0=default 300; -1=disable
  workspace_root_dir: "" # Root path of the conversation working directory (curl/wget downloads, read_file/glob/grep local analysis); empty=tmp/workspace, isolated beneath it by projects/{id} or conversations/{id}; do not use the system /tmp
  # system_prompt_path: prompts/single-agent.md # Optional: single-agent system prompt file (relative to this config file's directory); replaces the built-in prompt when non-empty and readable

  system_prompt_path: ""
# Call interception: takes effect immediately after editing and saving in "Security Protection -> Call Interception"; independent of the HITL approval allowlist.
# Government-domain protection is enabled by default even when old configs omit tool_guard. A restart is required after manually editing the YAML.
tool_guard:
  enabled: true
  rules:
    - id: government-domains
      name: Government website protection
      enabled: true
      # Go/RE2 regex; the named capture group match is used for {match} in the reminder.
      pattern: '(?i)(?:^|[^\p{L}\p{M}\p{N}_.-])(?P<match>(?:(?:[\p{L}\p{M}\p{N}_*-]+\.)+gov(?:\.[\p{L}\p{M}\p{N}_*-]+)*|gov(?:\.[\p{L}\p{M}\p{N}_*-]+)+|\.gov(?:\.[\p{L}\p{M}\p{N}_*-]+)*)\.?)(?:$|[^\p{L}\p{M}\p{N}_.-])'
      # Supports {match}, {tool}, {rule}; leave blank to use the generic reminder.
      message: 'Detected {match}; attacking government websites is forbidden. Please check the target and authorization scope, and switch to an authorized non-government target.'

# Human-in-the-loop (HITL) global allowlist: tools listed here are always exempt from approval, unioned with the conversation page's "Allowlisted tools (approval-free, comma-separated)"; the sidebar "Apply" can merge entries into this list and take effect immediately.
# For non-allowlisted tools, when the approver = audit Agent, the prompt is chosen according to the conversation's HITL mode:
#   approval → audit_agent_prompt
#   review_edit -> audit_agent_prompt_review_edit (may modify parameters before allowing)
hitl:
  # Global default human-in-the-loop mode: off=disabled, approval=approval mode, review_edit=review & edit; inherited by new conversations that have no separate configuration
  default_mode: off
  # Global default approver: human=manual approval, audit_agent=audit Agent; inherited by new conversations that have no separate configuration
  default_reviewer: human
  # Global default approval wait limit (seconds): 300=5 minutes, 0=no limit; inherited by new conversations that have no separate configuration
  default_timeout_seconds: 300
  # Audit Agent backend, choose one: openai=compatible-protocol chat model (prompt JSON); typesafe=TypeSafe Jev structured allow/block.
  audit_backend: openai
  # Audit Agent dedicated model. For the openai backend, blank fields reuse the main model; for the typesafe backend api_key is required and does not inherit the main model's key.
  audit_model:
    provider: "" # openai / claude; only effective for the openai backend, blank follows openai.provider
    base_url: "" # openai backend: blank follows the main model; typesafe backend: blank uses https://api.typesafe.ai
    api_key: "" # openai backend: blank follows the main model; typesafe backend: fill in the TypeSafe API Key
    model: "" # openai backend: a small model is recommended; typesafe backend: blank uses jev-latest
    reasoning:
      profile: "" # auto / deepseek_compat / openai_compat; only controls the thinking field of audit requests
  # Retention days for decided audit logs (same as MCP monitoring; defaults to 90 when omitted; 0 means no automatic cleanup)
  retention_days: 90
  # Add or remove according to the real tool names in your environment (matching the sidebar, case-insensitive); change to [] if you do not need a global approval exemption
  tool_whitelist: [read_file, ls, list_dir, glob, grep, tool_search, upsert_project_fact, get_project_fact, list_project_facts, search_project_facts, list_vulnerabilities, get_vulnerability, get_asset, query_assets, list_knowledge_risk_types, get_tool_execution, wait_tool_execution, batch_task_list, batch_task_get, manage_webshell_list, c2_event, c2_file]
  # audit_agent_prompt: |  # Approval mode; leave blank to use the built-in default, editable on the "Human-in-the-loop" page. For the openai backend it is a chat prompt; for the typesafe backend it is the Jev organization policy
  # audit_agent_prompt_review_edit: |  # Review & edit mode; leave blank to use the built-in default

  audit_agent_prompt: |-
    You are the CyberStrikeAI human-in-the-loop audit Agent. Review whether the tool call the Agent is about to execute would cause substantial harm to the system.

    You will receive JSON containing fields such as hitlMode, toolName, arguments/argumentsObj, userMessage, thinking, reasoningChain, planning.

    Rule priority:
    - Rules that must reject
    - Rules that must approve
    - Default allow rule

    Rule-matching requirements:
    - If both reject and approve are matched, you must reject.
    - Every decision must cite a rule number; you may not output "matched rule: none".
    - When no explicit reject or approve rule matches but no clearly destructive behavior is found, match D1: default allow.
    - Do not judge a script harmless solely because it is "run locally", "has a timeout set", or the "filename contains test"; you must inspect the actual command, code, or request parameters.
    - If the script's actual content is not visible, state that "the current parameters show no clear high-risk operation" rather than asserting "no persistent impact".

    Decision tone (default allow):
    - The vast majority of penetration-testing operations (including all kinds of attack payloads) should be allowed
    - Before deciding, determine: 1) What is this request doing (understand the request)? 2) What consequences does it cause?
    - Only when it "will clearly and directly break the normal operation of the target business system, or cause real user data loss / irreversible tampering" -> reject
    - When information is insufficient, parameters are somewhat broad, or the intent is merely probing -> approve
    - When unsure -> approve (better to let a recoverable test through than to wrongly block a legitimate attack)

    High-risk situations that must be rejected (examples, non-exhaustive):
    - Modifying/resetting any user or administrator password, forcibly logging out real users
    - Modifying server or service configuration (system config, Web/database parameters, firewall, startup items, scheduled tasks)
    - Modifying/creating/deleting users, roles, permissions (tampering with the account system)
    - Deleting or massively destroying data/files (DROP/TRUNCATE/DELETE whole tables, rm of important files, wiping the database)
    - Stopping, disabling, or restarting business services (systemctl stop, kill of critical processes, shutdown, reboot)
    - Large-scale stress testing or high concurrency causing a DoS

    The following must be approved (even if they look "highly aggressive" or include write operations):
    - All kinds of vulnerability probing and exploitation payloads (SQL injection including read/write types, command injection, deserialization, file inclusion, path traversal, SSRF, SSTI, XXE, etc.)
    - File upload testing, including uploading webshells and writing webshell files
    - Command-execution probing, reverse shells, dnslog / data-exfiltration probing
    - getshell exploitation such as database command execution, writing files, writing scheduled tasks, and in-memory implant injection
    - Password brute-forcing at a normal rate (not at DoS level)
    - Information gathering, port/directory scanning, enumeration, crawling
    - Read, query, and probe operations (including sensitive files)
    - Harmless post-compromise reconnaissance commands (whoami/id/uname/ls/cat, etc.)
    - Requests with broad parameters but no clear destructive intent

    Judgment principles:
    - A "write" by itself is not a reason to block -- penetration testing relies heavily on write operations (injection, upload, brute-force, getshell)
    - The key is whether it damages "business availability / critical data integrity"
    - Reject only when it clearly matches the reject list above

    Output only a single line of JSON, no markdown code block:
    {"decision":"approve"|"reject","comment":"Actual operation: ...; consequence if successful: ...; matched rule: ..."}
  audit_agent_prompt_review_edit: |-
    You are the CyberStrikeAI human-in-the-loop audit Agent. Review whether the tool call the Agent is about to execute would cause substantial harm to the system.

    You will receive JSON containing fields such as hitlMode, toolName, arguments/argumentsObj, userMessage, thinking, reasoningChain, planning.

    Rule priority:
    - Rules that must reject
    - Rules that must approve
    - Default allow rule

    Rule-matching requirements:
    - If both reject and approve are matched, you must reject.
    - Every decision must cite a rule number; you may not output "matched rule: none".
    - When no explicit reject or approve rule matches but no clearly destructive behavior is found, match D1: default allow.
    - Do not judge a script harmless solely because it is "run locally", "has a timeout set", or the "filename contains test"; you must inspect the actual command, code, or request parameters.
    - If the script's actual content is not visible, state that "the current parameters show no clear high-risk operation" rather than asserting "no persistent impact".

    Decision tone (default allow):
    - The vast majority of penetration-testing operations (including all kinds of attack payloads) should be allowed
    - Before deciding, determine: 1) What is this request doing (understand the request)? 2) What consequences does it cause?
    - Only when it "will clearly and directly break the normal operation of the target business system, or cause real user data loss / irreversible tampering" -> reject
    - When information is insufficient, parameters are somewhat broad, or the intent is merely probing -> approve
    - When unsure -> approve (better to let a recoverable test through than to wrongly block a legitimate attack)

    High-risk situations that must be rejected (examples, non-exhaustive):
    - Modifying/resetting any user or administrator password, forcibly logging out real users
    - Modifying server or service configuration (system config, Web/database parameters, firewall, startup items, scheduled tasks)
    - Modifying/creating/deleting users, roles, permissions (tampering with the account system)
    - Deleting or massively destroying data/files (DROP/TRUNCATE/DELETE whole tables, rm of important files, wiping the database)
    - Stopping, disabling, or restarting business services (systemctl stop, kill of critical processes, shutdown, reboot)
    - Large-scale stress testing or high concurrency causing a DoS

    The following must be approved (even if they look "highly aggressive" or include write operations):
    - All kinds of vulnerability probing and exploitation payloads (SQL injection including read/write types, command injection, deserialization, file inclusion, path traversal, SSRF, SSTI, XXE, etc.)
    - File upload testing, including uploading webshells and writing webshell files
    - Command-execution probing, reverse shells, dnslog / data-exfiltration probing
    - getshell exploitation such as database command execution, writing files, writing scheduled tasks, and in-memory implant injection
    - Password brute-forcing at a normal rate (not at DoS level)
    - Information gathering, port/directory scanning, enumeration, crawling
    - Read, query, and probe operations (including sensitive files)
    - Harmless post-compromise reconnaissance commands (whoami/id/uname/ls/cat, etc.)
    - Requests with broad parameters but no clear destructive intent

    Judgment principles:
    - A "write" by itself is not a reason to block -- penetration testing relies heavily on write operations (injection, upload, brute-force, getshell)
    - The key is whether it damages "business availability / critical data integrity"
    - Reject only when it clearly matches the reject list above

    Output only a single line of JSON, no markdown code block:
    {"decision":"approve"|"reject","comment":"Actual operation: ...; consequence if successful: ...; matched rule: ...","editedArguments":{...}}

    editedArguments rules (fill in only for approve when arguments need changing; otherwise omit the field):
    - Provide the complete replacement tool argument object, with keys matching argumentsObj
    - Make only the minimal necessary changes to narrow scope and remove risk (e.g. restrict path, drop dangerous flags)
    - Never widen the attack surface: do not expand the target scope, raise privileges or introduce destructive parameters
    - If the arguments cannot be changed safely and one of the high-risk cases above applies, reject; do not approve reluctantly
# Multi-agent and Pi single-agent (Pi SDK; single-agent entry /api/agent*, multi-agent /api/multi-agent*)
# Dependencies are pulled via go.mod; if downloads fail you can set: go env -w GOPROXY=https://goproxy.cn,direct
# Deep / Plan-Execute / Supervisor is set in the request body orchestration by the mode chosen on the chat page and WebShell; robots use robot_default_agent_mode
multi_agent:
  enabled: true
  robot_default_agent_mode: single # default for WeCom/DingTalk/Lark robots: single | deep | plan_execute | supervisor
  batch_use_multi_agent: false # when true, each subtask in the "batch tasks" queue also uses Pi multi-agent (higher cost)
  # plan_execute only: cap of the execute↔replan outer loop; 0 means the native default of 10. For main/sub-agent ReAct rounds see agent.max_iterations.
  plan_execute_loop_max_iterations: 0
  sub_agent_user_context_max_runes: 0 # Inject the user's original text into the sub-agent task description; 0=no truncation (default), >0=total character limit, negative=disable
  without_general_sub_agent: false # When false, keep Deep's built-in general-purpose sub-agent
  without_write_todos: false
  orchestrator_instruction: "" # Deep main agent: the body of agents/orchestrator.md (or a single .md with kind: orchestrator) takes priority; this is used when the body is empty; if both are empty, the native default is used
  orchestrator_instruction_plan_execute: "" # plan_execute main agent: the body of agents/orchestrator-plan-execute.md takes priority; this is used when the body is empty; if both are empty, the built-in plan_execute prompt is used (Deep's orchestrator_instruction is not used)
  orchestrator_instruction_supervisor: "" # supervisor main agent: the body of agents/orchestrator-supervisor.md takes priority; this is used when the body is empty; if both are empty, the built-in supervisor prompt is used (transfer/exit notes are still appended at runtime; Deep's orchestrator_instruction is not used)
  # Pi official Skills: progressive disclosure + optional local file/Shell (native Go tools). For the Skills directory see skills_dir.
  skills:
    disable: false # true: register neither the skill progressive-disclosure middleware nor the local FS/Shell tools; false: load according to the switches below
    filesystem_tools: true # true: register read_file/glob/grep/write/edit/execute (use with care in authorized environments); false: skill only, no local read/write or Shell
    skill_tool_name: skill # name of the "load skill" tool callable by the model, usually skill; it just needs to match the call name in skill package docs
  # Pi native middleware and Deep/Supervisor/plan_execute Executor tuning (struct in internal/config/config.go → MultiAgentPiMiddlewareConfig)
  # plan_execute: the patch/reduction/tool_search/plantask settings below also apply to the Executor (via ExecPreMiddlewares); Planner/Replanner do not get MCP pre-middlewares.
  runtime:
    tool_search_enable: true
    tool_search_min_tools: 20
    tool_search_always_visible: 12
    tool_search_always_visible_tools: [get_tool_execution, wait_tool_execution, cancel_tool_execution, search_knowledge_base]
    tool_search_include_builtins: true # true: backend built-in tools are always visible, bypassing tool_search
    plantask_enable: true
    plantask_rel_dir: .pi/plantask
    reduction_enable: true
    reduction_root_dir: tmp/reduction
    reduction_max_length_for_trunc: 12000
    model_retry_max_retries: 0 # 0 uses Pi SDK defaults
    model_retry_max_backoff_sec: 0 # 0 uses Pi SDK defaults
    model_failover_channels: []
    model_failover_max_retries: 0
    empty_response_continue_max_attempts: 5

# Database configuration
database:
  path: data/conversations.db # SQLite database file path, used to store conversation history and messages
  knowledge_db_path: data/knowledge.db # Knowledge-base database file path (optional; empty uses the conversation database), used to store knowledge-base items and vector embeddings, can be copied and reused independently
# ============================================
# Task-management-related configuration
# ============================================
# (The settings are already included in the conversation-related configuration)

# ============================================
# Vulnerability-management-related configuration
# ============================================

# Security tools configuration
# The system loads all .yaml tool configuration files from this directory
# Recommended approach: create a separate configuration file for each tool under the tools/ directory
security:
  # auto: native Job Object on Windows; Unix watchdog unless cgroup_root is set.
  # Linux production: configure a systemd service with Delegate=cpu memory pids; set
  # mode: required, cgroup_root: auto. Explicit isolation errors fail closed.
  process_isolation:
    mode: auto
    cgroup_root: ""
    max_processes: 256
    memory_max_bytes: 2147483648
    cpu_quota_micros: 0 # 0=no CPU cap; 100000=one core (100 ms period)
  tools_dir: tools # Tool configuration file directory (relative to the config file's directory)
  # Tool description mode: the source of the description exposed to the AI/API when loading tools under tools
  #   short - prefer short_description (brief description, saves tokens), fall back to description when empty
  #   full  - use description (detailed description)
  tool_description_mode: full
# ============================================
# MCP-related configuration
# ============================================

# MCP protocol configuration
# MCP (Model Context Protocol) is used for tool registration and invocation
mcp:
  enabled: false # Whether to enable the MCP server (http mode)
  host: 127.0.0.1 # MCP server listen address; only change this explicitly and configure network-layer access control when remote access is needed
  port: 8081 # MCP server port
  auth_header: "X-MCP-Token" # Optional global service-credential Header; for normal calls use the user Authorization: Bearer Token
  auth_header_value: "" # Global service-credential value, effective only when allow_global_access=true
  allow_global_access: false # High-risk compatibility mode: maps a static key to a global service identity; by default use the user Bearer Token
# External MCP configuration
external_mcp:
  servers: {}
# Built-in C2: set to false when the machine is used only for conversation/knowledge-base, so no listener starts and no C2 MCP tools are registered; enabled by default when this section is omitted
c2:
  enabled: true
# ============================================
# Knowledge-base-related configuration
# ============================================
knowledge:
  enabled: false # Whether to enable the knowledge-retrieval feature
  base_path: knowledge_base # Knowledge-base directory path (relative to the config file's directory)
  embedding:
    provider: openai # Embedding model provider (currently only openai is supported)
    model: text-embedding-v4 # Embedding model name
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1 # Leave blank to use the base_url from the OpenAI configuration
    api_key: sk-xxxxxxx # Leave blank to use the api_key from the OpenAI configuration
  retrieval:
    top_k: 5 # number of Top-K results returned by retrieval
    similarity_threshold: 0.4 # cosine similarity threshold (0-1); results below it are filtered out
    # Pi MultiQuery: the LLM rewrites the query, then multi-route vector retrieval is fused
    multi_query:
      max_queries: 4 # retrieval cap including the original query; when set to 1, vector retrieval is done directly
    # Reranking (always on): dashscope uses gte-rerank; other OpenAI-compatible endpoints use /v1/rerank
    rerank:
      provider: "" # empty=inferred from base_url: dashscope | cohere
      model: "" # empty=dashscope->gte-rerank, cohere->rerank-multilingual-v3.0
      base_url: "" # Leave blank to use the embedding / openai base_url
      api_key: "" # Leave blank to use the embedding / openai api_key
    post_retrieve:
      prefetch_top_k: 20 # Number of vector candidates per MultiQuery variant; 0=built-in max(top_k*4,20)
      max_context_chars: 0 # 0 means unlimited; otherwise the upper bound of total Unicode characters of returned text (whole chunks)
      max_context_tokens: 0 # 0 means unlimited; the tiktoken total-token upper bound
    sub_index_filter: ""
  # ============================================
  # Indexing configuration (used to work around API limits)
  # ============================================
  indexing:
    # Chunking configuration
    chunk_size: 512 # Maximum tokens per chunk (default 512); long text is split into multiple chunks
    chunk_overlap: 50 # Number of overlapping tokens between chunks (default 50), to keep context coherent
    max_chunks_per_item: 0 # Maximum number of chunks per knowledge item (0 means unlimited), to prevent a single file from consuming too much API quota
    # Rate-limit configuration (to resolve 429 errors)
    max_rpm: 0 # Maximum requests per minute (default 0 means unlimited), e.g. OpenAI defaults to 200 RPM
    rate_limit_delay_ms: 300 # Interval between requests in milliseconds (default 300), used to avoid API rate limits, set to 0 for no limit
    # Recommended values: 200 req/min ~= 300ms, 100 req/min ~= 600ms

    # Retry configuration
    max_retries: 3 # max retries (default 3); retries automatically on rate limits or server errors
    retry_delay_ms: 1000 # retry interval in milliseconds (default 1000); the delay increases with each retry
    # Chunking strategy (Pi): markdown_then_recursive = split by Markdown headings first, then recursively; recursive = recursive splitting only. When empty, the program defaults to markdown_then_recursive
    chunk_strategy: markdown_then_recursive
    # Embedding HTTP request timeout (seconds). 0 means use the built-in default (usually 120), consistent with the vectorization API client
    request_timeout_seconds: 120
    # true: when indexing, prefer the content of the disk file pointed to by the knowledge item's file_path (Pi FileLoader); false: use the body stored in the database. Falls back to the DB if reading from disk fails
    prefer_source_file: false
    # Upper bound of text items per embedding API request (index writes are batched by this). Must be <= the provider's limit (e.g. some compatible endpoints allow at most 10); too large easily causes 400
    batch_size: 10
    # Pi indexer.WithSubIndexes: list of logical partition tags written to sub_indexes in the vector table; retrieval can filter with sub_index_filter; use [] if not needed
    sub_indexes: []
# ============================================
# Robot configuration (WeCom, DingTalk, Lark)
# ============================================
# Used to talk with CyberStrikeAI from a phone via WeCom/DingTalk/Lark; can be used without deploying on a server
# Configurable in System Settings -> Robot Settings
robots:
  wechat: # WeChat iLink (personal WeChat ClawBot, bound by scanning a QR code)
    enabled: false
    # Authentication defaults to user_binding; dedicated robots can change it to service_account and must restrict the real senders
    auth:
      mode: user_binding # user_binding | service_account
      # service_user_id: "RBAC user ID of admin or a dedicated service account"
      # allowed_external_users: ["t:tenant|u:sender"]
    bot_token: ""
    ilink_bot_id: ""
    ilink_user_id: ""
    base_url: https://ilinkai.weixin.qq.com
    bot_type: "3"
    bot_agent: CyberStrikeAI/1.0
  wecom: # WeCom (WeChat Work)
    enabled: false
    auth:
      mode: user_binding
    token: ""
    encoding_aes_key: ""
    corp_id: ""
    secret: ""
    agent_id: 0
  dingtalk: # DingTalk
    enabled: false
    auth:
      mode: user_binding
    client_id: ""
    client_secret: ""
    allow_conversation_id_fallback: false
  lark: # Lark (Feishu)
    enabled: false
    auth:
      mode: user_binding
    app_id: ""
    app_secret: ""
    verify_token: ""
    allow_chat_id_fallback: false
  telegram: # Telegram
    enabled: false
    auth:
      mode: user_binding
    bot_token: ""
    bot_username: ""
    allow_group_messages: false
  slack: # Slack
    enabled: false
    auth:
      mode: user_binding
    bot_token: ""
    app_token: ""
  discord: # Discord
    enabled: false
    auth:
      mode: user_binding
    bot_token: ""
    allow_guild_messages: false
  qq: # QQ robot
    enabled: false
    auth:
      mode: user_binding
    app_id: ""
    client_secret: ""
    sandbox: true
# ============================================
# Skills-related configuration
# ============================================

# Skill package directory: each subdirectory has only a standard SKILL.md (Agent Skills: front matter only name, description) + optional extra files; no SKILL.yaml
# Example: skills/cyberstrike-pi-demo/
skills_dir: skills # Skills config directory (relative to the config file's directory)
# ============================================
# Multi-agent sub-Agents (Markdown, the single place to maintain them)
# ============================================
# Each .md: YAML front matter (name / id / description / tools / bind_role / optional max_iterations>0 to override the global value / optional kind: orchestrator) + the body is the system prompt
# Main agent: the fixed filename orchestrator.md, or any filename + front matter kind: orchestrator (only one allowed per directory); the main agent does not participate in the task sub-agent list
# Advanced usage: you can still write sub_agents inside the multi_agent block; they are merged with this directory, and for the same id the YAML can be overridden by the .md
agents_dir: agents
# ============================================
# Role-related configuration
# ============================================

# The system loads all .yaml role configuration files from this directory
# Each role should have its own configuration file, e.g. roles/CTF.yaml, roles/default.yaml, etc.
roles_dir: roles # Role configuration directory (relative to the config file's directory)
# ============================================
# Project management and the fact blackboard
# ============================================
project:
  enabled: true
  # During compression, automatically save the continuation summary as a tentative note (one updated per conversation/agent, not replacing confirmed facts)
  context_checkpoints: true
  # default_project_id: "" # Optional: the default project ID when robots/batch tasks create a conversation
  # The project continuation supplement is included within the fact-index budget; the working-file candidate list has a separate budget of at most 4000 characters
  fact_index_max_runes: 65000
  # Budget for the fact-relationship overview section (reserved from the total index budget)
  fact_index_path_max_runes: 10000
  fact_summary_max_runes: 24000
  default_inject_deprecated: false

# ============================================
# One-click update (optional)
# ============================================
# Update source: a repository address; updates follow that repository's own default branch; when not configured it is the official repository
# (https://github.com/AIPentest/CyberStrikeAI.git). When GitHub access is poor you can fill in a mirror address here,
# To follow your own fork, change only this one place; the console "System Settings -> One-click Update" page lets you fill it in and save directly.
# Non-git directories (extracted/packaged installs) need no configuration either, and can run "Connect update source" on the console "One-click Update" page
# to turn the directory into a git worktree tracking that repository, after which one-click update works as in a normal install.
# update:
#   repo: https://github.com/AIPentest/CyberStrikeAI.git  # A repository address; blank/omitted = the official repository
